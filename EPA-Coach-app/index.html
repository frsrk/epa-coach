<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EPA Coach">
<meta name="theme-color" content="#050608">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>EPA Discussion Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
html{padding-top:env(safe-area-inset-top,0px);overscroll-behavior:none} body{margin:0} img{max-width:100%} [hidden]{display:none!important} button{touch-action:manipulation;-webkit-user-select:none;user-select:none} .sync{display:none!important}
/* Layout: one-column phone app. Sticky header, scrolling view, fixed bottom tab bar. Black dashboard look with neon data colours throughout. */
:root{
  --bg:#050608; --surface:#0D1015; --sunk:#1A1F28; --ink:#EAF0F7; --muted:#8892A2; --line:#232A35;
  --accent:#00E5FF; --accent2:#FF2BD6; --accent-ink:#04070A; --accent-soft:#082A30;
  --good:#A6FF3D; --good-soft:#1C2A0E; --warn:#FFB224; --warn-soft:#2E220A; --bad:#FF3D71; --bad-soft:#2E0E18; --none:#4A5260;
  --glow:drop-shadow(0 0 6px rgba(0,229,255,.55));
  --read:"Manrope", -apple-system, "Segoe UI", system-ui, sans-serif;
  --ui:"Manrope", -apple-system, "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:14px; --tabh:64px;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;transition:background .25s ease}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
textarea,input,select{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--mono)}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:10px;padding-block:12px 10px;min-height:56px}
.brand{font-family:var(--read);font-weight:700;font-size:20px;letter-spacing:-.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-family:var(--ui);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.brand{font-family:var(--mono);letter-spacing:-.02em}
.back{border:0;background:none;padding:6px 8px 6px 0;font-weight:700;color:var(--accent);display:flex;align-items:center}
.sync{font-size:11px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:5px;white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--none);display:inline-block}
.sync.on i{background:var(--good)}
.iconbtn{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;width:40px;height:40px;display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px}
.iconbtn.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);box-shadow:0 0 12px rgba(0,229,255,.35)}

main{padding-block:16px calc(var(--tabh) + 96px + env(safe-area-inset-bottom,0px))}
main.with-player{padding-bottom:calc(var(--tabh) + 150px + env(safe-area-inset-bottom,0px))}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr);height:var(--tabh)}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.02em}
nav.tabs button svg{width:23px;height:23px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs button[aria-current="page"] .ico{background:var(--accent-soft);color:var(--accent);box-shadow:0 0 12px rgba(0,229,255,.35)}
.ico{display:grid;place-items:center;width:52px;height:30px;border-radius:15px}

.player{position:fixed;left:0;right:0;bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px));z-index:24;background:#0B1A20;color:var(--ink);border-top:1px solid var(--accent);box-shadow:0 -4px 20px rgba(0,229,255,.15)}
.player .wrap{display:flex;align-items:center;gap:8px;padding-block:10px}
.player .t{flex:1;min-width:0;font-size:13px;line-height:1.3}
.player .pmeta{opacity:.7}
.player .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.player button{border:0;background:rgba(127,127,127,.25);color:inherit;border-radius:999px;padding:7px 12px;font-weight:800;font-size:13px}

h1,h2,h3{font-family:var(--ui);font-weight:800;text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:28px;line-height:1.15;font-weight:700}
h2{font-size:21px;line-height:1.25;font-weight:700}
h3{font-size:17px;line-height:1.3;font-weight:600}
p{margin:0}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.big{font-family:var(--mono);font-size:48px;font-weight:700;line-height:1.1}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.callout{background:var(--accent-soft);border:1px solid rgba(0,229,255,.25);border-radius:var(--r);padding:14px 16px}
.dark{background:linear-gradient(135deg,#1B0A1F,#0B1A20);border:1px solid rgba(255,43,214,.45);box-shadow:0 0 24px rgba(255,43,214,.12);color:var(--ink);border-radius:var(--r);padding:18px}
.dark .eyebrow{color:var(--accent2)}

.btn{border:0;border-radius:12px;padding:13px 18px;font-weight:800;font-size:15px;background:var(--accent);color:var(--accent-ink);box-shadow:0 0 16px rgba(0,229,255,.35);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px}
.btn.block{width:100%}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent);box-shadow:none}
.btn.soft{background:var(--sunk);color:var(--ink);box-shadow:none}
.btn.inv{background:var(--accent2);color:#0A0208;box-shadow:0 0 16px rgba(255,43,214,.4)}
.btn.inv-ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.small{min-height:38px;padding:8px 14px;font-size:14px}
.btn.live{background:var(--bad);color:#0A0208}
.btn:disabled{opacity:.45}
.link{border:0;background:none;padding:0;color:var(--accent);font-weight:800;text-decoration:underline;text-underline-offset:3px}
.inv-link{color:var(--bad)}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunk);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:9px;padding:10px 6px;font-weight:800;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);box-shadow:0 0 12px rgba(0,229,255,.4)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--ink)}
.ksb{display:inline-block;font-family:var(--mono);font-size:11px;font-weight:700;padding:3px 7px;border-radius:6px;background:var(--accent-soft);color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;padding:4px 9px;border-radius:999px;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.none{background:var(--sunk);color:var(--muted)}

/* tile picker (shared) */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tile{position:relative;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 12px 13px;text-align:left;display:flex;flex-direction:column;gap:5px;min-height:72px;transition:transform .12s ease,background .15s ease}
.tile:active{transform:scale(.97)}
.tile.wide{grid-column:1/-1}
.tile .tt{display:flex;align-items:center;gap:8px}
.tile .tt b{font-size:14.5px;line-height:1.25;font-weight:800}
.tile .ti{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--sunk);color:var(--accent);flex:none}
.tile .ti svg{width:18px;height:18px}
.tile .tm{display:flex;justify-content:space-between;gap:6px;font-size:12px;color:var(--muted);font-weight:700;margin-top:auto}
.tile .tm span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .mini{height:4px;border-radius:2px;background:var(--sunk);overflow:hidden}
.tile .mini i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:2px}
.tile[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);box-shadow:0 0 16px rgba(0,229,255,.3),inset 0 0 12px rgba(0,229,255,.08)}
.tile[aria-pressed="true"] .tt b{color:var(--accent)}
.tile[aria-pressed="true"] .ti{background:var(--accent);color:var(--accent-ink)}

/* reading */
.read{font-family:var(--read);font-size:16.5px;line-height:1.65;color:#D6DEE8}
.read p+p{margin-top:10px}
.read ul{margin:8px 0 0;padding-left:20px}
.read li+li{margin-top:4px}
ol.keys{margin:0;padding-left:0;list-style:none;counter-reset:k}
ol.keys li{counter-increment:k;position:relative;padding:10px 0 10px 38px;border-top:1px solid var(--line);font-size:16px;line-height:1.5}
ol.keys li:first-child{border-top:0}
ol.keys li::before{content:counter(k);position:absolute;left:0;top:10px;width:26px;height:26px;border-radius:8px;background:var(--accent-soft);color:var(--accent);border:1px solid rgba(0,229,255,.4);font-family:var(--mono);font-size:12px;font-weight:800;display:grid;place-items:center}
.flow{font-family:var(--mono);font-size:12.5px;color:var(--accent);font-size:13.5px;font-weight:600;background:var(--sunk);border-radius:10px;padding:10px 12px;margin-top:8px;line-height:1.55;overflow-x:auto}
.flow div+div{margin-top:4px}
.sec h3{margin-bottom:6px}
.sec{padding-top:16px;border-top:1px solid var(--line)}
.say{border-left:3px solid var(--accent2);padding-left:14px}
details>summary{list-style:none;cursor:pointer}
details>summary::-webkit-details-marker{display:none}

/* flashcards */
.flash{width:100%;min-height:230px;border-radius:18px;padding:20px;text-align:left;display:flex;flex-direction:column;gap:12px;background:linear-gradient(160deg,#0F1B22,#0A0D12);border:1.5px solid var(--accent);box-shadow:0 0 22px rgba(0,229,255,.25);transition:transform .15s ease}
.flash:active{transform:scale(.985)}
.flash .fq{font-size:21px;line-height:1.4;font-weight:700}
.flash.flipped{background:linear-gradient(160deg,#1E0B22,#0A0D12);border-color:var(--accent2);box-shadow:0 0 22px rgba(255,43,214,.25)}
.flash.flipped .eyebrow{color:var(--accent2)}
.flash.flipped .fq{font-size:18.5px;font-weight:500}
.flash .an{display:flex;flex-direction:column;gap:4px;margin-top:auto;padding-top:12px;border-top:1px dashed rgba(255,43,214,.4);font-size:16px;line-height:1.5;color:#D6DEE8}
.flash .an .eyebrow{color:var(--good)!important}

.prog{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.prog>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px;box-shadow:0 0 8px rgba(0,229,255,.5)}

/* discussion */
.bubble{border-radius:16px;padding:14px 16px;font-size:16.5px;line-height:1.55}
.bubble.a{background:var(--surface);border:1px solid rgba(0,229,255,.35);border-top-left-radius:4px}
.bubble.u{background:#1B0E20;border:1px solid rgba(255,43,214,.3);margin-left:28px;border-top-right-radius:4px;font-size:15.5px}
.who{font-family:var(--ui);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
textarea.answer{width:100%;min-height:150px;border:1.5px solid var(--line);border-radius:14px;padding:14px;background:var(--surface);font-size:16.5px;line-height:1.55;resize:vertical}
textarea.answer:focus{border-color:var(--accent);outline:none;box-shadow:0 0 12px rgba(0,229,255,.25)}
.micbtn{border:1.5px solid var(--accent2);background:var(--surface);color:var(--accent2);border-radius:12px;min-height:48px;padding:0 14px;display:inline-flex;align-items:center;gap:6px;font-weight:800;flex:none}
.micbtn svg{width:20px;height:20px}
.micbtn.live{background:var(--bad);border-color:var(--bad);color:#0A0208;animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,61,113,.5)}100%{box-shadow:0 0 0 14px rgba(255,61,113,0)}}
.thinking{display:flex;align-items:center;gap:10px;color:var(--muted);font-weight:700}
.dots{display:inline-flex;gap:4px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:b 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}

.grade{display:flex;align-items:center;gap:16px}
.grade .g{font-family:var(--mono);font-size:34px;font-weight:700;line-height:1}
.ring{width:118px;height:118px;flex:none}
.qres{border-top:1px solid var(--line)}
.fb{display:grid;gap:10px;margin-top:12px}
.fb h4{margin:0 0 4px;font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase}
.fb ul{margin:0;padding-left:18px}
.fb .good h4{color:var(--good)} .fb .bad h4{color:var(--bad)} .fb .warn h4{color:var(--warn)}

/* quick fire */
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-size:15.5px;font-weight:600;line-height:1.4}
.opt .ol{flex:none;width:24px;height:24px;border-radius:7px;background:var(--sunk);color:var(--accent);font-family:var(--mono);display:grid;place-items:center;font-size:12px;font-weight:800}
.opt.right{border-color:var(--good);background:var(--good-soft)} .opt.right .ol{background:var(--good);color:#0A1200}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)} .opt.wrong .ol{background:var(--bad);color:#0A0208}
.opt:disabled{opacity:1}
.bar{display:grid;grid-template-columns:minmax(0,1fr) 46px;gap:4px 10px;align-items:center}
.bar .lbl{font-weight:700;font-size:14px;min-width:0}
.bar .val{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.bar .track{grid-column:1/-1;height:10px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar .track i{display:block;height:100%;border-radius:99px}

/* dashboard */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;position:relative}
.panel,.card{background:linear-gradient(180deg,#10141B,#0B0E13)}
.panel.hero{display:flex;flex-direction:column;align-items:center;gap:8px;padding-bottom:18px;box-shadow:inset 0 0 0 1px rgba(0,229,255,.08),0 0 40px rgba(0,229,255,.06)}
.panel.hero .eyebrow{align-self:flex-start}
.glow{filter:var(--glow)}
.scale{position:relative;width:100%;max-width:300px;padding-bottom:18px}
.scale .track{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.scale .track i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#00E5FF,#FF2BD6);box-shadow:0 0 10px rgba(255,43,214,.5)}
.scale span{position:absolute;top:12px;transform:translateX(-50%);font-family:var(--mono);font-size:10px;color:var(--muted);white-space:nowrap}
.scale span::before{content:"";position:absolute;left:50%;top:-14px;width:1.5px;height:12px;background:var(--ink);opacity:.6}
.sw{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.sw .panel{padding:14px 12px;display:flex;flex-direction:column;gap:4px}
.sw .eyebrow{font-size:10px;margin-bottom:4px}
.swrow{border:0;background:none;padding:7px 0;display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:6px;align-items:center;text-align:left;border-top:1px solid var(--line)}
.swrow:first-of-type{border-top:0}
.swrow .rk{font-size:11px;color:var(--muted)}
.swrow .nm{font-size:13px;font-weight:700;line-height:1.25;min-width:0}
.swrow b{font-size:13.5px}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kpi{padding:14px}
.kpi span{display:block;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kpi b{display:block;font-size:26px;margin-top:4px;text-shadow:0 0 14px currentColor}
.pierow{display:flex;align-items:center;gap:16px;margin-top:10px;flex-wrap:wrap}
.donut{flex:none;max-width:100%}
.legend{flex:1;min-width:140px;display:flex;flex-direction:column;gap:8px}
.legend div{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13px;font-weight:700}
.legend i{width:10px;height:10px;border-radius:3px}
.legend span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nbar{border:0;background:none;padding:0;text-align:left;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 10px;align-items:center}
.nbar .lbl{font-weight:700;font-size:14px}
.nbar b{font-size:14px}
.nbar .track{grid-column:1/-1;height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.nbar .track i{display:block;height:100%;border-radius:99px}
.nbar .sub{grid-column:1/-1;font-size:11.5px;color:var(--muted);font-family:var(--mono)}
svg text{font-family:var(--ui)}
svg text.mono{font-family:var(--mono)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + 20px + env(safe-area-inset-bottom,0px));background:var(--accent);color:var(--accent-ink);padding:11px 16px;border-radius:12px;font-weight:700;font-size:14px;z-index:40;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.2)}
.list{display:flex;flex-direction:column}
.list>*{border-top:1px solid var(--line)}
.list>*:first-child{border-top:0}
.li{display:flex;gap:12px;align-items:center;padding:13px 0;width:100%;text-align:left;border-left:0;border-right:0;border-bottom:0;background:none}
.li .n{flex:none;width:30px;height:30px;border-radius:9px;background:var(--sunk);display:grid;place-items:center;font-weight:800;font-size:12px}
.li .n{color:var(--accent)}
.li .n.done,.li.live .n{background:var(--accent);color:var(--accent-ink);box-shadow:0 0 10px rgba(0,229,255,.5)}
.li .b{flex:1;min-width:0}
.li .b b{display:block;font-size:15.5px;line-height:1.35}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<header class="top"><div class="wrap" id="hdr"></div></header>
<main id="main"><div class="wrap" id="view"></div></main>
<div class="player" id="player" hidden></div>

   say:"The Security Data Hub had a frontend, backend services, a database, configuration crawlers and external sources across cloud boundaries, and there was no single picture of it. I gathered what existed, checked uncertain links with engineers, drew a block diagram, then refined it: clearer labels, arrow direction for data flow, and removing detail that didn't help a decision. The second version became an onboarding reference and a tool for impact analysis, and I used it in our show-and-tell. The key trade-off was accuracy against readability.",
   qs:["Who was the diagram for, and how did that shape it?","What did you remove in the second version and why?"] },
 { id:"p3-2", title:"Search, filtering, sorting and pagination", topics:["data","design"], ksbs:["K10","S3","S17","B1","B6"],
   simple:"As data grew, sending every record to the screen would be slow. I built one consistent way for the backend to search, filter, sort and return data a page at a time, with totals, and reused it across all resources so the frontend only had to learn it once.",
   body:[
    ["Problem","Returning all records transfers unnecessary data, slows the UI, increases backend load, makes browsing hard and limits scalability."],
    ["What I delivered","A consistent listing capability: text search, field filters, sort field, ascending or descending, page number, page size, total records, total pages."],
    ["How it works","> Client sends query parameters → Backend validates → Query applies filters → Sorting → Offset and limit → Return items + pagination metadata\nIn SQL terms: WHERE for filters and search, ORDER BY for sorting, LIMIT and OFFSET for paging, and a COUNT for totals."],
    ["Why consistency","One shared approach means easier frontend integration, less duplicated code, a consistent user experience, easier testing and maintenance. It is a reusable pattern."],
    ["Testing","Correct and invalid endpoints, search terms, filters, sort order, page sizes and numbers, stable responses, error status codes. It is also a performance (non-functional) consideration."],
    ["Challenges","Wrong routes gave 404s, response shapes needed frontend alignment, totals were needed as well as items, filters needed predictable syntax, duplicate logic needed consolidating."]
   ],
   say:"As the hub's data grew, returning every record would have slowed the UI and loaded the backend. I built a shared listing pattern: the client sends search, filter, sort and page parameters, the backend validates them, and the database query applies WHERE filters, ORDER BY, then LIMIT and OFFSET, returning the items with total and page metadata. Making it consistent across feeds, patterns and applications meant the frontend integrates once and the logic is tested once. I tested valid and invalid routes, filters, sort order and paging edge cases, and fixed 404s from wrong routes.",
   qs:["How does pagination work at the database level?","Why did you make the approach consistent across resources?","How did you test it?"] },
 { id:"p3-3", title:"Frontend table and data-shape debugging", topics:["ui","data"], ksbs:["S2","S3","B6","B8"],
   simple:"The table crashed because the code tried to loop over the API response as if it were a list, but the API actually sent an object with the list inside it plus page info. I traced the data from the database to the screen, pulled out the real list, added safety checks and gave each row a stable ID.",
   body:[
    ["Problem","The UI called .map() on a value that wasn't an array."],
    ["Why","The API returned an object: items, total, page_size, page_num. The UI assumed the whole response was the array."],
    ["Fix","- Reproduced the error\n- Inspected the browser console\n- Inspected the API response\n- Located the actual array\n- Updated response extraction\n- Added defensive handling\n- Retested the table"],
    ["Stable row keys","Rows needed unique keys and the data didn't always expose one where expected. Supplying a stable identifier lets React track rows, render updates correctly, avoid warnings and prevent inconsistent behaviour."],
    ["Learning","Frontend errors can start with backend assumptions. Check the whole data path:\n> Database → API response → Client function → State → Component rendering"]
   ],
   say:"The table crashed with a .map is not a function error. I reproduced it, checked the console, then looked at the actual API response: since I'd added pagination, it returned an object with items, total, page size and page number, not a bare array. I extracted items, added a defensive fallback to an empty array, and retested. I also gave each row a stable key so React could track updates. The lesson was to debug along the whole data path from database to component, not just where the error appears.",
   qs:["How did you find the root cause?","Why do React rows need stable keys?"] },
 { id:"p3-4", title:"Pattern add and edit forms", topics:["ui","testing"], ksbs:["S2","S5","S13","B6"],
   simple:"I built the pages for adding and editing patterns, with validation and clear success and error messages. My first version kept duplicate copies of the form values, and review feedback showed me how to let the form library manage state instead, which made it simpler and less buggy.",
   body:[
    ["Delivered","Add page, edit page, form controls, validation, success and error messages, API submission, tests."],
    ["Validation","Required values present, clear feedback for incorrect values, no submission with invalid input, edit form pre-filled with existing values."],
    ["Review feedback","The first version used local state alongside the form library's state: duplication, harder synchronisation, risk of inconsistent values."],
    ["Improvement","Relied on the form library, removed redundant state, used built-in error handling, adjusted validation timing, simplified event handling."],
    ["Outcome","Easier to maintain, more consistent, better tested, clearer for users."]
   ],
   say:"I built the add and edit pages for patterns: form controls, validation, success and error messages, and API submission. My approach to UI is to make invalid states impossible to submit and to give clear feedback. In review, a senior pointed out I was holding values in local state as well as in the form library, which risked them drifting apart. I refactored to let the library be the single source of truth and use its built-in error handling. The forms became simpler and easier to test, and I've applied that single-source-of-truth idea since.",
   qs:["What is your approach to building user interfaces?","Why was duplicate state a problem?"] },
 { id:"p3-5", title:"Show and tell", topics:["comms"], ksbs:["K4","S15","B4","B7"],
   simple:"I demoed the hub live to a mixed audience. For engineers I covered components, APIs and data flow; for less technical colleagues I focused on what it lets them do faster and why that reduces risk.",
   body:[
    ["Why a demo","A live demo shows the user problem, the solution, the workflow, the architecture, current limitations and next steps better than code alone."],
    ["Technical audience","Components, APIs, data flows, architecture choices."],
    ["Less technical audience","User benefits, faster data discovery, reduced manual effort, improved traceability."]
   ],
   say:"I ran a show-and-tell of the Security Data Hub to a mixed audience. I opened with the user problem, then demoed the workflow live, used my architecture diagram, and finished with limitations and next steps. For engineers I went into the APIs, pagination and data flow; for less technical colleagues I focused on faster data discovery, less manual effort and better traceability. A live demo works better than slides for showing real behaviour, while the diagram gave everyone the same mental model.",
   qs:["How did you tailor the demo to different people?","Compare a demo with a written update: when is each better?"] }
]},
{ id:"p4", title:"BindPlane automation, frontend testing and Responsible AI", sub:"Git sync, traceability, unit tests, bugs, fairness inputs", pieces:[
 { id:"p4-1", title:"Git-based configuration synchronisation", topics:["vcs","policy"], ksbs:["K8","S14","S3","S17","B1","B5","B6","B8"],
   simple:"The BindPlane crawler read config files from a Git repository, but it was using old local copies. I made it clone the repo if missing or pull the latest changes if present, using GitPython, with credentials kept in environment variables, never in the code.",
   body:[
    ["Problem","Processing stale local copies created inaccurate metadata."],
    ["Why automate","Manual copying causes outdated data, inconsistent runs, human error, poor traceability and extra effort."],
    ["What it does","> Does the local repository exist? No → clone. Yes → pull latest. Then process files.\nBuilt with GitPython (an off-the-shelf library) to drive Git from Python."],
    ["Security","Credentials came from environment variables, not hard-coded, reducing the risk of exposure, secrets entering version history, or credentials appearing in review output."],
    ["Outcome","The crawler became repeatable, current, automated, traceable and maintainable."]
   ],
   say:"The BindPlane crawler read configuration stored in version control, but processed whatever local copy existed, which could be stale. I used GitPython to check for the repo locally, clone it if missing or pull the latest if present, then process. I chose an established library instead of shelling out to Git myself because it's tested and handles errors cleanly. Credentials were read from environment variables so they never entered source or version history, which follows our secure coding policy. The crawler now always works from current config and runs are repeatable.",
   qs:["Why environment variables for credentials?","Why GitPython rather than writing your own Git calls?"] },
 { id:"p4-2", title:"Source traceability links", topics:["data","policy"], ksbs:["S3","S17","B5","B8"],
   simple:"Users needed to click from a processed record straight back to the config file it came from. I built links to the original file in the repository, and handled file paths with odd characters by normalising and URL-encoding them.",
   body:[
    ["Why traceability","Troubleshooting, verification, auditability, maintenance, ownership, review."],
    ["Delivered","A source-link builder producing links to the original repository location."],
    ["Challenge","File paths can contain characters unsafe in URLs. The builder normalised path separators, built a consistent repository path, encoded unsafe characters and produced a working link."]
   ],
   say:"Users needed to trace ingested metadata back to its source config file, which matters for audit and troubleshooting in a bank. I built a link builder that normalises path separators, constructs a consistent repository path and URL-encodes unsafe characters, so every record links to the exact file it came from. It's a small feature, but it makes the data auditable.",
   qs:["Why does traceability matter in a regulated organisation?","What went wrong with unencoded paths?"] },
 { id:"p4-3", title:"Frontend unit testing", topics:["testing"], ksbs:["K12","S5","S13","B6"],
   simple:"As the forms got more complex, clicking through them by hand wasn't enough. I wrote automated tests that check fields render, validation fires, submission succeeds or fails correctly and errors show. I faked (mocked) the API so tests run fast without a real backend, and made a shared wrapper so components get the Chakra UI setup they need.",
   body:[
    ["Problem","Manual testing alone missed regressions: fields not rendering, validation not triggering, wrong API payloads, buttons not calling actions, error states missing, data loading in the wrong order."],
    ["Tests covered","Rendering, form input, validation, successful and failed submission, mocked API responses, button interaction, conditional display, error messages."],
    ["Chakra provider wrapper","Components needed Chakra UI context. A reusable test wrapper supplied it: correct context, less duplicated setup, consistent tests, components rendering as in the app."],
    ["Mocking","API calls were mocked so tests run without a live backend, can force success and error responses, can inspect request payloads, and stay deterministic."],
    ["Check this detail","Know the name of the test runner and library your team uses (for example Jest or Vitest with React Testing Library) and be ready to say why."]
   ],
   say:"As the pattern forms grew, I added component unit tests covering rendering, input, validation, successful and failed submission, and error messages. I mocked the API so tests were fast and deterministic and so I could force error responses that are hard to trigger for real, and assert on the payload sent. Components needed Chakra UI context, so I built one reusable provider wrapper instead of repeating setup in each test. Unit tests with mocks give fast feedback on component logic; the trade-off is they don't prove the real API integration, which is why we also had API tests and manual checks.",
   qs:["Why mock the API? What are the risks of mocking?","How do unit tests differ from integration tests?"] },
 { id:"p4-4", title:"Frontend event and loading bugs", topics:["ui","testing"], ksbs:["S2","S13","B6","B8"],
   simple:"Some buttons were wired to the wrong action and some components tried to show data before it had loaded. I traced the event handlers and loading order, fixed them, and made components handle four states: loading, success, empty and error.",
   body:[
    ["Diagnosis","Reproduced the issue, reviewed console errors, checked event handlers, checked async loading order, updated interaction logic, added tests."],
    ["Why loading state matters","Without it, components access undefined objects, empty state, missing properties or incomplete select options."],
    ["Four states","> Loading · Success · Empty · Error\nA robust component handles each one explicitly."]
   ],
   say:"Some actions were wired to the wrong handlers, and some components rendered before their data arrived, which caused undefined errors, for example a select with no options yet. I reproduced each, read the console errors, traced the handlers and the async loading order, and fixed them. Now components explicitly handle loading, success, empty and error states, and I added tests for each so the bugs can't quietly return.",
   qs:["What four states should a data-driven component handle?","How did you stop the bug coming back?"] },
 { id:"p4-5", title:"Categorical input validation", topics:["data","behaviours"], ksbs:["S3","B6","B8"],
   simple:"The fairness tool groups people into categories, but someone could pass in decimal values like probabilities, and each unique decimal would become its own group, which is meaningless. I added a check that rejects that kind of data up front with a clear error.",
   body:[
    ["Problem","Continuous values (0.812, 0.643, 0.921) could be treated as categories, creating fragmented, meaningless groups."],
    ["Why validate","Fairness analysis needs meaningful categories. Bad input creates huge numbers of groups, misleading metrics, poor interpretability and hidden data-quality issues."],
    ["Delivered","> Receive prediction or label column → Inspect suitability → Reject unsupported continuous values → Continue only with valid categories"],
    ["Outcome","Fail fast: the evaluator stops early on unsuitable data instead of silently producing misleading analysis."]
   ],
   say:"The Responsible AI evaluator grouped records by prediction and label, but if someone passed raw probabilities, every distinct decimal became its own group and the metrics were meaningless, without any error. I added validation before grouping that detects continuous values and rejects them with a clear message. It's the fail-fast principle: in a fairness tool, a confident wrong answer is worse than an error.",
   qs:["Why is fail fast better than silently continuing here?","How did you detect a continuous column?"] },
 { id:"p4-6", title:"Improved grouping logic", topics:["data"], ksbs:["S3","B6","B8"],
   simple:"The evaluator grouped by every column, including IDs and timestamps, so you'd get one group per row. I limited grouping to the columns that matter: demographic, prediction and label.",
   body:[
    ["Problem","Grouping by every column (row IDs, timestamps, audit fields, transaction fields, unrelated features) creates a group per row or many irrelevant combinations."],
    ["Change","Grouping restricted to declared demographic, prediction and label columns."],
    ["Why better","> Demographic group + predicted outcome + actual outcome\nThe groups now match the question being asked."],
    ["Outcome","More meaningful, interpretable, less fragmented, aligned with Responsible AI use cases."]
   ],
   say:"The evaluator was technically working but conceptually wrong: it grouped by every column, so IDs and timestamps produced a group per row. I changed it to group only by the declared demographic, prediction and label columns, so each group answers the actual fairness question. It taught me that code can pass its tests and still be wrong for the business purpose. That's validation, not just verification.",
   qs:["Why was grouping by every column a problem?","How did you know the original behaviour was wrong if no test failed?"] }
]},
{ id:"p5", title:"Analysis, OpenAPI and fairness pipelines", sub:"Use cases, generated client, fairness metrics, Vertex AI", pieces:[
 { id:"p5-1", title:"Use cases and analysis artefacts", topics:["analysis"], ksbs:["S9"],
   simple:"Before building, I wrote use cases: who the user is, what they want, what must be true first, the normal steps, and what can go wrong. This makes sure we build what users need, not just what we assume.",
   body:[
    ["What a use case captures","Actor, goal, preconditions, main flow, alternative flows, failure conditions, expected result."],
    ["Example","Actor: authenticated user\nGoal: create or update a feed\nPrecondition: user has the correct permissions\n- 1. User opens form\n- 2. Enters details\n- 3. Client validates input\n- 4. API processes request\n- 5. Database updated\n- 6. Success displayed\nAlternative flows: validation fails, permission denied, server error, record not found."],
    ["Why","Implementation matches user needs rather than technical assumptions, and alternative flows become test scenarios."],
    ["User story version","As an analyst, I want to create or update a feed, so that its details stay accurate.\nAcceptance criteria: required fields validated before submit; success message on save; clear error if permission is denied."]
   ],
   say:"Before building the feed create and edit flow, I wrote a use case: the actor is an authenticated user, the goal is to create or update a feed, and the precondition is the right permissions. The main flow runs from opening the form through client validation, API processing and the database update to a success message. I also listed alternative flows: validation failure, permission denied, server error, record not found. Those alternative flows became my test scenarios and error messages. A user story is lighter, used for Jira tickets; a use case is better when there are several paths and failure cases.",
   qs:["What's the difference between a use case and a user story?","How did the use case feed into testing?"] },
 { id:"p5-2", title:"OpenAPI-generated frontend client", topics:["design","ui"], ksbs:["K7","S17","K4","S15","B8"],
   simple:"Instead of hand-writing every API call in the frontend, which drifts out of date, we generated typed functions automatically from the backend's OpenAPI spec. I also found that a missing ROOT_PATH=/api setting was the real cause of broken routes, and fixed it properly in the backend instead of patching the frontend.",
   body:[
    ["Problem","Hand-written API calls drift: wrong URL, method, fields, response type, outdated enums, missing validation assumptions."],
    ["Approach","> Backend OpenAPI specification → Generator → Typed frontend client\nAn off-the-shelf generator produced request and response types, API functions, models, enums and client configuration."],
    ["New considerations","Base URL, reverse-proxy path, runtime config, root path, client overrides, regenerating after API changes."],
    ["Debugging lesson","Locally, ROOT_PATH=/api was missing. The frontend correctly expected /api/... routes; the backend exposed unprefixed ones. Temporary frontend edits fixed symptoms, but the right fix was configuring the backend root path and reverting the workarounds."],
    ["Outcome","Stronger contracts, less duplication, better editor support, safer refactoring, easier integration."]
   ],
   say:"Our backend already published an OpenAPI spec, so we generated the frontend client from it: typed requests, responses, functions and enums. That's an off-the-shelf solution to a common problem, API calls drifting from the backend, and it turns mismatches into compile errors. The trade-off is extra configuration. I hit this when routes 404'd locally: the frontend expected /api routes but my local backend lacked ROOT_PATH=/api. I'd patched the frontend at first, but once I found the root cause I set the backend config and reverted the workarounds, because patching symptoms would have broken other environments.",
   qs:["Why generate the client rather than write it by hand?","Why revert the frontend workarounds?"] },
 { id:"p5-3", title:"Selection rate", topics:["data","policy"], ksbs:["S3","K10","B5","B8"],
   simple:"Selection rate is the share of a group that gets a particular outcome. If 40 of 100 people in a group are approved, the rate is 40%. Comparing rates across groups shows where outcomes differ and need a closer look.",
   body:[
    ["Formula","> Selection rate = selected outcomes in group ÷ eligible records in group\n> 40 ÷ 100 = 0.40 (40%)"],
    ["Why useful","Lets outcomes be compared across demographic groups. A difference doesn't prove discrimination; it flags a disparity to investigate."],
    ["Implementation decisions","Grouping columns, the selected outcome, eligible rows, missing data, minimum group size (support), output structure."]
   ],
   say:"Selection rate is the proportion of a group receiving the selected outcome: selected over eligible. For 40 out of 100 that's 0.4. In the fairness tool I had to define the grouping columns, which outcome counts as selected, which rows are eligible, how to handle missing data, and a minimum group size, because a rate from five records is noise. A difference between groups is a signal to investigate, not proof of bias.",
   qs:["Why does group size matter?","Does a different selection rate prove discrimination?"] },
 { id:"p5-4", title:"Disparate impact", topics:["data","policy"], ksbs:["S3","K10","B5","B8"],
   simple:"Disparate impact divides a group's selection rate by a reference group's rate. 0.40 ÷ 0.50 = 0.80. It flags unequal outcomes but can't tell you why they happen or whether they're unlawful.",
   body:[
    ["Formula","> Disparate impact = group selection rate ÷ reference-group selection rate\n> 0.40 ÷ 0.50 = 0.80"],
    ["Reference group","The result depends on the chosen reference. The code identifies eligible groups, calculates reference rates, avoids division by zero, handles unsupported groups and stays transparent."],
    ["Interpretation","It can't explain why a disparity happened, whether the model caused it, whether it is unlawful, or whether the data is biased. It is an investigative indicator, not a legal or ethical conclusion. (A common rule of thumb flags values below 0.8.)"]
   ],
   say:"Disparate impact compares a group's selection rate to a reference group's: 0.4 over 0.5 gives 0.8. I implemented it to identify eligible groups, compute the reference rate, guard against dividing by zero and report unsupported groups transparently. Ethically, I'm careful about what it means: it flags a disparity worth investigating, but it can't tell you whether the model caused it or whether it's unlawful. Presenting it as a verdict would be misleading.",
   qs:["How did you avoid invalid division?","What can't this metric tell you?"] },
 { id:"p5-5", title:"Exploratory notebook analysis", topics:["testing","data"], ksbs:["S3","S5","S13","B8"],
   simple:"Before writing proper code, I tested the maths in notebooks with real-looking data to check the formulas, groups and edge cases were right. Once proven, I moved the logic into tested, reusable functions.",
   body:[
    ["Why notebooks first","Load representative data, inspect columns, validate categories, group records, calculate preliminary metrics, examine edge cases, compare expected with actual."],
    ["Risk of skipping it","Wrong formulas, invalid groups, mishandled missing values, misleading outputs, hard debugging."],
    ["Transition","> One-off notebook cells → Validated functions + tests + pipeline components"]
   ],
   say:"Analytical code hides assumptions, so I prototyped in notebooks first: loading representative data, checking categories, grouping and comparing calculated metrics against values I'd worked out by hand, including edge cases like missing values and tiny groups. Once the method was validated, I moved the logic into reusable functions with unit tests and then into pipeline components. Notebooks are for exploring; tested modules are for production.",
   qs:["Why not go straight to production code?","How did you know the notebook results were right?"] },
 { id:"p5-6", title:"Reusable metrics components", topics:["design","testing"], ksbs:["K7","S3","S5","S13"],
   simple:"I split the fairness workflow into small functions that each do one job: validate, group, count, calculate rates, compare. Small single-purpose pieces are easier to test, reuse and fix.",
   body:[
    ["Responsibilities","Input validation, grouping, group counts, selection-rate calculation, reference-group eligibility, reference-rate calculation, disparate-impact calculation, output construction."],
    ["Why modular","Easier to test, understand, reuse, replace and troubleshoot; less mixing of responsibilities."],
    ["Design principle","Single responsibility: validating inputs should not also submit a cloud pipeline. Separation improves maintainability and testability."]
   ],
   say:"I broke the fairness workflow into single-purpose components: validation, grouping, counts, selection rate, reference eligibility, reference rate, disparate impact and output. That's the single responsibility principle. Each function can be unit tested in isolation with small known inputs, reused in the notebook and the pipeline, and replaced without touching the rest. When a number looked wrong, I could test each step separately to find which one was at fault.",
   qs:["What design principle did you apply?","How did modularity help testing?"] },
 { id:"p5-7", title:"Vertex AI pipeline", topics:["testing","vcs","design"], ksbs:["S3","K7","K12","S5","S13","B6","B9"],
   simple:"Running notebooks by hand wasn't repeatable, so the fairness workflow was packaged into a cloud pipeline on Vertex AI. I restored missing files, fixed imports and config, compiled and ran it, and checked the outputs. A pipeline compiling doesn't mean it works: you have to run it and check the results.",
   body:[
    ["Why a pipeline","Runs steps in order, packages dependencies, repeatable, keeps execution records, supports automation, runs in a managed cloud environment."],
    ["Work done","- Restored missing pipeline files\n- Fixed import problems\n- Corrected component configuration\n- Compiled the pipeline\n- Updated tests\n- Submitted a run and validated execution\n- Removed generated artefacts from source control\n- Renamed a component when its job grew"],
    ["Four levels of evidence","> Compilation: the definition can be produced\n> Submission: the platform accepts the job\n> Execution: the job runs\n> Functional validation: the outputs are correct\nA compiled YAML file alone is not proof the workflow works."],
    ["Naming","A component called 'preprocessing' was doing metric calculations. Renaming it stopped the structure misleading future maintainers."]
   ],
   say:"Manual notebooks weren't reproducible, so we packaged the fairness workflow as Vertex AI pipeline components. I took ownership when files were missing and imports were broken: I restored them, fixed component config, compiled, submitted a run and validated the outputs. I distinguish four levels of evidence: compiles, accepted, executes, and produces correct results. Only the last one proves it works. I also removed generated artefacts from Git, since they should be rebuilt not versioned, and renamed a preprocessing component that had grown into metric calculation so the name told the truth.",
   qs:["What's the difference between compiling and validating a pipeline?","Why remove generated artefacts from source control?"] }
]}
];

const THEORY = [
 { id:"t-sdlc", title:"SDLC stages, inputs and outputs", topics:["sdlc"], ksbs:["K1","K3"],
   simple:"Seven stages: plan, analyse, design, build, test, deploy, maintain. Each one takes something in and hands something on.",
   body:[
    ["Stages","- Planning. In: business need. Out: scope, estimates, plan.\n- Analysis. In: stakeholder needs. Out: requirements, user stories, use cases, acceptance criteria.\n- Design. In: requirements. Out: architecture diagrams, data models, API designs, test plan.\n- Implementation. In: designs, specs. Out: code, unit tests, pull requests.\n- Testing. In: built code, test plan. Out: test results, defect reports, sign-off.\n- Deployment. In: tested build. Out: release in the target environment, release notes.\n- Maintenance. In: live system, incidents, feedback. Out: fixes, improvements, new requirements."],
    ["Roles","Product owner (priorities, acceptance), business analyst (requirements), architect (design), developers (build, unit test), testers/QA (test), DevOps/platform (pipelines, environments), security (controls), scrum master or delivery lead (process, blockers), stakeholders and users (feedback, UAT)."],
    ["Your role","Developer on a security engineering team: build and test tickets, raise blockers, respond to review, document, and increasingly validate full solutions."]
   ],
   say:"The lifecycle is planning, analysis, design, build, test, deploy and maintain, and each stage's output feeds the next: requirements feed design, designs feed the code, tested builds feed deployment, and live feedback feeds new requirements." },
 { id:"t-method", title:"Agile, Scrum, Kanban and Waterfall", topics:["method"], ksbs:["K5"],
   simple:"Waterfall is plan everything then build once. Agile is build small, show, adjust, repeat. Scrum and Kanban are two ways of doing Agile.",
   body:[
    ["Scrum","Fixed-length sprints (often two weeks). Roles: product owner, scrum master, developers. Events: sprint planning, daily stand-up, sprint review, retrospective. Artefacts: product backlog, sprint backlog, increment."],
    ["Kanban","Continuous flow, a board with columns (To do, In progress, Review, Done), work-in-progress limits, focus on cycle time."],
    ["Waterfall","Sequential phases with sign-off between them. Suits fixed scope, stable requirements and heavy compliance documentation."],
    ["V-model","A Waterfall variant where each development stage pairs with a test stage: requirements with acceptance testing, design with system and integration testing, code with unit testing."],
    ["Hybrid","Many regulated organisations mix them: Waterfall-style governance and release gates, Agile delivery inside."],
    ["Compare","Both cover the same activities. Agile gives early feedback and flexibility but needs engaged stakeholders; Waterfall gives predictability and documentation but late feedback and costly change."]
   ],
   say:"Agile and Waterfall share the same lifecycle activities; the difference is how often you loop and when feedback arrives." },
 { id:"t-test", title:"Testing frameworks and methodologies", topics:["testing"], ksbs:["K12","S5","S13"],
   simple:"Test small things a lot and big things less (the testing pyramid). Use the right type of test for each risk, and use frameworks to automate them.",
   body:[
    ["Test types","- Unit: one function or component in isolation\n- Integration: parts working together (API plus database)\n- System: the whole application end to end\n- User acceptance (UAT): users confirm it meets their needs\n- Regression: re-running tests after changes\n- Non-functional: performance, load, security, usability, accessibility\n- Security: e.g. checking for exposed secrets, access control, input validation"],
    ["Testing pyramid","Many fast unit tests at the bottom, fewer integration tests, few slow end-to-end tests at the top."],
    ["Methodologies","- TDD: write a failing test, make it pass, refactor (red, green, refactor)\n- BDD: behaviour written as Given / When / Then scenarios\n- V-model: each development stage paired with a test stage\n- Black box (test behaviour) vs white box (test internal logic)\n- Static testing (code review, linting) vs dynamic testing (running code)"],
    ["Frameworks","Python: pytest (fixtures, parametrised tests), unittest. JavaScript: Jest or Vitest as test runners, React Testing Library for components (test what the user sees), Cypress or Playwright for end-to-end. API: Swagger UI, Postman."],
    ["Evaluate (distinction)","Unit tests with mocks: fast and deterministic, but can't prove real integration. Integration tests: catch contract and data problems, but slower and need environments. End-to-end: closest to the user, but slow and brittle. Choose by risk: mocks for component logic and error paths, API tests for contracts, manual and UAT for the user journey."]
   ],
   say:"I'd justify a framework by the risk it covers: component unit tests with mocks for fast feedback on logic and error states, API tests for the contract, and manual or user testing for the real journey." },
 { id:"t-db", title:"Relational and non-relational databases", topics:["data"], ksbs:["K10","S3"],
   simple:"Relational databases store data in tables with fixed columns, linked by keys, queried with SQL. Non-relational (NoSQL) databases store documents, key-value pairs, wide columns or graphs, with flexible structure that scales out easily.",
   body:[
    ["Relational","Tables, rows, columns, primary and foreign keys, SQL, ACID transactions, normalisation. Examples: PostgreSQL, MySQL, SQL Server. Best for structured data with relationships and strong consistency, like your Security Data Hub models."],
    ["Normalisation","1NF: atomic values, no repeating groups (why Useful Links became its own table). 2NF: no partial dependency on part of a composite key. 3NF: no transitive dependencies. Reduces duplication and update anomalies."],
    ["Non-relational types","- Document (MongoDB, Firestore): JSON-like documents, flexible schema\n- Key-value (Redis, DynamoDB): very fast lookups, caching\n- Wide-column (Cassandra, Bigtable): huge write volumes, time series\n- Graph (Neo4j): relationships, e.g. fraud networks"],
    ["Trade-offs","NoSQL: flexible schema, horizontal scaling, high write throughput, often eventual consistency, weaker joins. Relational: consistency, joins and integrity, harder to scale horizontally, schema changes need migrations (Alembic)."],
    ["Your context","Relational: SQLModel models, Alembic migrations, filters and pagination. Security event data from logs is high-volume and semi-structured, the kind of data non-relational and big-data stores handle well."],
    ["ORM","SQLModel maps Python classes to tables so code works with objects while SQL is generated underneath. Parameterised queries also protect against SQL injection."]
   ],
   say:"I'd choose relational where data is structured and relationships and integrity matter, like the hub's feeds and links, and non-relational for high-volume, flexible data like raw security events or caching." },

    ["Patterns you've used","- Template: SOAR playbook skeletons\n- Shared query pattern: pagination, filtering and sorting across resources\n- Code generation and contract-first API: OpenAPI client\n- Wrapper/provider: the Chakra test wrapper\n- Layered architecture: routes, services, models\n- Pipeline: Vertex AI components in sequence"],
    ["Classic patterns","Singleton, Factory, Observer (React state updates, event listeners), Adapter (wrapping one interface to fit another, like rule migration), Repository (data access behind an interface), MVC."],
    ["Bespoke vs off-the-shelf","Off-the-shelf (GitPython, the OpenAPI generator, Chakra UI, Vertex AI): faster, tested, maintained by others, but less control, dependency risk, licensing and security review. Bespoke (shared pagination, playbook skeletons): fits the exact need, but you own maintenance. Recommend off-the-shelf for solved, generic problems and bespoke for domain-specific logic."],

 { id:"t-vcs", title:"Version control and CI/CD", topics:["vcs"], ksbs:["S14","K8"],
   simple:"Git keeps a full history of every change. Branches let you work safely, pull requests get your work reviewed, and CI/CD pipelines automatically build, test and deploy.",
   body:[

    ["Why review","Catches defects, shares knowledge, enforces standards, creates an audit trail (important in a bank)."],
    ["CI/CD","Continuous integration: every push is built and tested automatically. Continuous delivery or deployment: tested builds are released through environments. Your team uses Harness for pipelines and container images."],
    ["Good practice","Never commit secrets (use environment variables or a secrets manager), use .gitignore for generated artefacts, migrations under version control (Alembic), resolve conflicts carefully, revert rather than rewrite shared history."]

 { id:"t-comms", title:"Communication methods", topics:["comms"], ksbs:["K4","S15","B7","B4"],
   simple:"Pick the channel and the level of detail to suit the audience and the message.",
   body:[
    ["Methods","- Stand-ups: quick sync, blockers; fast but not a record\n- Written summaries, Jira, Slack/Teams: a lasting record, asynchronous, good for decisions; can be misread without tone\n- Code review comments: precise, tied to code\n- Diagrams: shared mental model for any audience\n- Live demos / show and tell: shows real behaviour, builds buy-in\n- Documentation: onboarding, audit\n- Meetings and calls: complex or sensitive discussion, quick back-and-forth"],
    ["Technical vs non-technical","Technical: precise terms, code, logs, data models, trade-offs. Non-technical: outcomes, risk, benefits, timelines, analogies, plain language, visuals."],
    ["Compare (distinction)","Synchronous (stand-up, demo) is fast and interactive but leaves no record; asynchronous (written, Jira) creates a record and includes people in other time zones or who missed the call, but feedback is slower. Visual (diagrams, demos) works across audiences. The best approach often combines them: discuss live, then confirm in writing."],

 { id:"t-algo", title:"Algorithms and data structures", topics:["algo"], ksbs:["K9","S16"],

   body:[

    ["Algorithms","Linear search O(n), binary search O(log n) on sorted data, bubble sort O(n²), merge sort O(n log n), quicksort O(n log n) on average."],
    ["Concurrency","A critical section is code that touches shared data; a race condition is when results depend on timing between threads. Fix with locks or atomic operations."],
    ["Your work","Grouping records uses hash maps (group key to counts). Pagination uses offset and limit. Validation is conditional logic."]
