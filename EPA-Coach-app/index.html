 {t:"w",topic:"method",q:"Give two similarities between Agile and Waterfall.",a:"Both cover the same lifecycle activities (requirements, design, build, test, deploy), and both aim to deliver working, tested software that meets stakeholder needs with appropriate documentation.",k:["same","stages","requirement","design","test","deploy","both","deliver","document"]},
 {t:"w",topic:"method",q:"When would Waterfall be a better choice than Agile?",a:"When requirements are fixed and well understood, scope is unlikely to change, and heavy documentation or regulatory sign-off is required, such as a fixed regulatory reporting change.",k:["fixed","stable","requirement","regulat","document","sign","predict","scope"]},

 {t:"m",topic:"testing",q:"A test that checks a single function in isolation is a:",o:["System test","Unit test","UAT","Load test"],a:1,why:"Unit tests target the smallest testable part in isolation."},
 {t:"m",topic:"testing",q:"Why mock an API in frontend tests?",o:["To make tests slower","To run deterministically without a live backend and force success or error responses","To test the real database","To deploy faster"],a:1,why:"Mocks make tests fast, repeatable and able to simulate failures."},
 {t:"m",topic:"testing",q:"Validation asks:",o:["Did we build it according to the design?","Did we build the right thing for the real problem?","Does it compile?","Is the code formatted?"],a:1,why:"Verification is 'built it right'; validation is 'built the right thing'."},
 {t:"m",topic:"testing",q:"In TDD, what comes first?",o:["Write the code","Write a failing test","Deploy","Refactor"],a:1,why:"Red, green, refactor: start with a failing test."},
 {t:"m",topic:"testing",q:"The testing pyramid recommends:",o:["Mostly end-to-end tests","Many unit tests, fewer integration tests, few end-to-end tests","Only manual testing","Equal numbers of each"],a:1,why:"Fast, cheap unit tests form the base."},
 {t:"m",topic:"testing",q:"Which is a non-functional test?",o:["Form saves a pattern","Page loads 1,000 records in under 2 seconds","Button calls the right handler","Validation shows an error"],a:1,why:"Performance is a non-functional quality."},
 {t:"m",topic:"testing",q:"Re-running existing tests after a change to catch new breakages is:",o:["Smoke testing","Regression testing","UAT","Static testing"],a:1,why:"Regression tests confirm old behaviour still works."},
 {t:"m",topic:"testing",q:"BDD scenarios are usually written as:",o:["Given / When / Then","Red / Green / Refactor","Plan / Do / Check","Input / Process / Output"],a:0,why:"BDD describes behaviour in Given-When-Then form."},
 {t:"m",topic:"testing",q:"Who typically performs user acceptance testing?",o:["The compiler","End users or business stakeholders","Only developers","The database"],a:1,why:"UAT confirms the software meets users' real needs."},
 {t:"w",topic:"testing",q:"What is the difference between a unit test and an integration test?",a:"A unit test checks one small piece, like a function or component, in isolation, often with dependencies mocked. An integration test checks that several parts work together, like the API and database, catching contract and data problems units miss.",k:["isolat","single","one","together","combin","mock","depend","api","database"]},
 {t:"w",topic:"testing",q:"Your pipeline compiled. Name the further levels of evidence needed to say it works.",a:"Submission (the platform accepts the job), execution (the job actually runs) and functional validation (the outputs are correct against expected values).",k:["submi","execut","run","output","correct","validat"]},
 {t:"w",topic:"testing",q:"Give one advantage and one limitation of testing against mocked APIs.",a:"Advantage: fast, deterministic tests that can force error cases without a backend. Limitation: they can't prove the real API contract or integration works, so the mock may drift from reality.",k:["fast","determin","error","force","real","contract","integration","drift"]},

 {t:"m",topic:"sdlc",q:"Which is an output of the design stage?",o:["Production incident report","Architecture diagram and data model","Customer complaint","Release notes"],a:1,why:"Design turns requirements into diagrams, models and API designs."},
 {t:"m",topic:"sdlc",q:"Acceptance criteria are mainly an input to:",o:["Requirements and testing","Hosting costs","Code formatting","Container builds"],a:0,why:"They define 'done' and become test conditions."},
 {t:"m",topic:"sdlc",q:"Which stage handles bug fixes on the live system?",o:["Planning","Design","Maintenance","Analysis"],a:2,why:"Maintenance covers fixes and improvements after release."},
 {t:"w",topic:"sdlc",q:"List the stages of the SDLC in order.",a:"Planning, analysis (requirements), design, implementation (build), testing, deployment, maintenance.",k:["plan","analy","requirement","design","implement","build","test","deploy","maint"]},

 {t:"m",topic:"vcs",q:"What is the main purpose of a pull request?",o:["Delete a branch","Propose changes for review before merging","Back up the database","Deploy to production instantly"],a:1,why:"PRs enable peer review and leave an audit trail."},
 {t:"m",topic:"vcs",q:"Where should credentials live?",o:["Hard-coded in source","In a commit message","Environment variables or a secrets manager","In the README"],a:2,why:"Keeping secrets out of code keeps them out of version history."},
 {t:"m",topic:"vcs",q:"Continuous integration means:",o:["Merging once a year","Automatically building and testing every change","Manual deployment only","Writing docs continuously"],a:1,why:"CI runs builds and tests on every push."},
 {t:"m",topic:"vcs",q:"Generated build artefacts should usually:",o:["Be committed to Git","Be ignored and rebuilt by the pipeline","Be emailed","Be stored in the README"],a:1,why:"They are reproducible outputs; committing them creates noise and conflicts."},
 {t:"w",topic:"vcs",q:"Why is peer review especially important in a bank?",a:"It catches defects and security issues early, shares knowledge, enforces coding standards and creates an auditable record of who changed what and who approved it, which supports regulatory and change-control requirements.",k:["defect","bug","security","audit","standard","knowledge","regulat","approv","traceab"]},

 {t:"m",topic:"design",q:"The single responsibility principle says:",o:["Each developer owns one file","A function or class should have one reason to change","Use one database only","One test per project"],a:1,why:"Small single-purpose units are easier to test and maintain."},
 {t:"m",topic:"design",q:"DRY stands for:",o:["Do Repeat Yourself","Don't Repeat Yourself","Data Ready Yet","Deploy, Run, Yield"],a:1,why:"Avoid duplicating logic, as with the shared pagination pattern."},
 {t:"m",topic:"design",q:"Generating a typed client from an OpenAPI spec mainly prevents:",o:["Slow CSS","Frontend calls drifting from the backend contract","Database deadlocks","Merge conflicts"],a:1,why:"The spec becomes the single source of truth for both sides."},
 {t:"m",topic:"design",q:"Which pattern notifies subscribers when state changes?",o:["Singleton","Observer","Factory","Adapter"],a:1,why:"Observer: listeners react to events, as with React state and event handlers."},
 {t:"m",topic:"design",q:"Which diagram best shows the order of calls between frontend, API and database?",o:["ER diagram","Sequence diagram","Pie chart","Gantt chart"],a:1,why:"Sequence diagrams show interactions over time."},
 {t:"w",topic:"design",q:"Give one advantage and one risk of using an off-the-shelf library instead of bespoke code.",a:"Advantage: faster, already tested and maintained by others (e.g. GitPython). Risk: less control, dependency and security vulnerabilities, licensing, and being affected by upstream changes.",k:["faster","tested","maintain","proven","control","depend","vulnerab","security","licen"]},

 {t:"m",topic:"policy",q:"Which is a GDPR principle?",o:["Data maximisation","Data minimisation","Indefinite retention","Public by default"],a:1,why:"Collect and process only the data you need."},
 {t:"m",topic:"policy",q:"Least privilege means:",o:["Give everyone admin access","Grant only the access needed for the task","Remove all access","Share passwords with the team"],a:1,why:"Limiting access reduces damage from mistakes or compromise."},
 {t:"m",topic:"policy",q:"A disparate impact ratio of 0.8 tells you:",o:["The model is illegal","There is a disparity worth investigating","The data is correct","Nothing at all"],a:1,why:"It is an investigative indicator, not a legal conclusion."},
 {t:"w",topic:"policy",q:"Name three GDPR principles.",a:"Any three of: lawfulness, fairness and transparency; purpose limitation; data minimisation; accuracy; storage limitation; integrity and confidentiality; accountability.",k:["lawful","fair","transparen","purpose","minimis","accura","storage","integrity","confidential","accountab"]},

 {t:"m",topic:"comms",q:"Best way to explain a new system to non-technical managers?",o:["Walk through source code","Show a simple diagram and focus on benefits and risk","Send raw logs","Discuss query syntax"],a:1,why:"Visuals and outcomes suit non-technical audiences."},
 {t:"m",topic:"comms",q:"Why write a summary after a verbal discussion?",o:["To replace meetings","To create a record and confirm shared understanding","To hide decisions","It isn't useful"],a:1,why:"It catches misunderstandings and supports those who missed the call."},
 {t:"w",topic:"comms",q:"Compare synchronous and asynchronous communication at work.",a:"Synchronous (stand-ups, calls, demos) is fast and interactive but leaves little record and excludes people not present. Asynchronous (Jira, written updates, messages) creates a lasting record and suits different schedules, but feedback is slower and tone can be misread.",k:["fast","interact","record","written","slower","misread","present","schedule","real time","live"]},

 {t:"m",topic:"ui",q:"A data-driven component should handle which states?",o:["Only success","Loading, success, empty and error","Only error","Hover only"],a:1,why:"Handling all four avoids crashes on undefined data."},
 {t:"m",topic:"ui",q:"Why do React list rows need stable keys?",o:["For styling","So React can track and update rows correctly","To encrypt data","To sort automatically"],a:1,why:"Keys let React match rows between renders."},
 {t:"m",topic:"ui",q:"'x.map is not a function' most likely means:",o:["The network is down","x is not an array, e.g. an object wrapping the list","React is not installed","CSS failed"],a:1,why:"The paginated response was an object with items inside."},
 {t:"w",topic:"ui",q:"Why is client-side validation not enough on its own?",a:"Client checks improve user experience but can be bypassed, so the backend must also validate input to protect data integrity and security.",k:["bypass","server","backend","secur","integrity","both"]},

 {t:"m",topic:"analysis",q:"Which is part of a use case?",o:["CSS colours","Actor, goal, preconditions and flows","Git branch name","Container image"],a:1,why:"Use cases describe who does what and what can go wrong."},
 {t:"w",topic:"analysis",q:"Write a user story for adding a useful link to a feed.",a:"As an analyst, I want to add a useful link to a feed so that colleagues can find related resources quickly. Acceptance criteria: link URL is validated; link is saved and shown on the feed; a clear error appears if saving fails.",k:["as a","i want","so that","accept","criteria"]},

 {t:"m",topic:"algo",q:"Which structure is last-in, first-out?",o:["Queue","Stack","Hash table","Graph"],a:1,why:"Stacks are LIFO, like an undo history."},
 {t:"m",topic:"algo",q:"Binary search requires the data to be:",o:["Unsorted","Sorted","In a linked list","In a graph"],a:1,why:"It halves a sorted range each step: O(log n)."},
 {t:"m",topic:"algo",q:"Average lookup time in a hash table is:",o:["O(n²)","O(n)","O(1)","O(log n)"],a:2,why:"Hashing jumps straight to the bucket."},
 {t:"m",topic:"algo",q:"A race condition is:",o:["A fast algorithm","A bug where results depend on the timing of concurrent operations","A sorting method","A database index"],a:1,why:"Protect critical sections with locks."},
 {t:"m",topic:"algo",q:"Merge sort's time complexity is:",o:["O(n log n)","O(n²)","O(1)","O(log n)"],a:0,why:"It splits and merges in n log n time."},
 {t:"w",topic:"algo",q:"Selection rate: 30 of 120 eligible records were selected. What is it?",a:"30 ÷ 120 = 0.25, or 25%.",k:["0.25","25"]},
 {t:"w",topic:"algo",q:"Group rate 0.30, reference rate 0.50. What is the disparate impact ratio?",a:"0.30 ÷ 0.50 = 0.6.",k:["0.6"]},

 {t:"m",topic:"behaviours",q:"You find your test didn't actually run before a demo. Best response?",o:["Say it passed","Tell the team honestly and run it","Remove the test","Skip the demo silently"],a:1,why:"Integrity: never claim validation without evidence."},
 {t:"w",topic:"behaviours",q:"Give an example of continued professional development you could mention in the EPA.",a:"For example: learning React testing and Vertex AI pipelines on the job, acting on code-review feedback (like single source of truth in forms), and self-directed study or certifications, with a plan for the next skill.",k:["learn","course","certif","feedback","study","read","plan","next"]}
];

// ===== TOPIC STUDY: key points, flashcards with analogies, watch-outs =====
const TSTUDY = {
 sdlc:{ intro:"The stages every piece of software goes through, what goes in and out of each, and who does what.",
  key:["Seven stages: plan, analyse, design, build, test, deploy, maintain.","Each stage's output is the next stage's input: requirements → designs → code → tested build → release → feedback.","Your inputs: Jira tickets, acceptance criteria, API specs, reviewer comments.","Your outputs: SQLModel models, routes, React components, tests, pull requests, Alembic migrations.","Deploy for you means feature branch → PR → peer review → release-candidate branch → Harness → container image.","Roles: product owner (priorities), BA (requirements), architect (design), developers, testers, DevOps, security.","Your role grew: observe → support → small tasks → own tickets → validate whole solutions.","Joining mid-lifecycle (the SIEM migration) means recovering the reasoning from earlier stages first."],
  watch:["Always name inputs AND outputs for each stage. Describing stages alone is the most common thin answer."],
  cards:[
   {f:"What are the SDLC stages in order?",b:"Planning, analysis, design, implementation, testing, deployment, maintenance.",an:"Like building a house: decide you need one, list what rooms you need, draw the plans, build, inspect, move in, then fix the leaks."},
   {f:"What are the inputs and outputs of the design stage?",b:"In: requirements and acceptance criteria. Out: architecture diagrams, data models, API designs, a test approach.",an:"The architect takes your wish list and hands the builder a blueprint."},
   {f:"Give a deployment example from your work.",b:"Feature branch, pull request, peer review, release-candidate branch validated in Harness, Alembic migration, container image.",an:"Like an aircraft pre-flight checklist: no plane leaves the gate until every check is ticked."},
   {f:"What does maintenance include?",b:"Bug fixes, review feedback, migration corrections, route fixes, better tests, updating seed data, removing generated artefacts.",an:"Servicing a car: it was built once, but it needs regular care to keep running safely."},
   {f:"Who signs off that a ticket is done?",b:"Acceptance criteria met, peer review approved, pipeline passing; the product owner or lead accepts the work.",an:"A referee and the scoreboard both have to agree the goal counts."},
   {f:"How did you get up to speed joining mid-project?",b:"Documents + rule configs + observing alerts + asking seniors, then writing summaries and playing them back.",an:"Joining a TV series at season three: you watch the recap, read the wiki and ask a friend before forming opinions."}
  ]},
 method:{ intro:"How teams organise the lifecycle: Waterfall, Agile (Scrum, Kanban) and the V-model.",
  key:["Waterfall: sequential phases with sign-off. Predictable, well documented, but late feedback and costly change.","Agile: small increments with constant feedback. Adaptable, problems found early, but needs engaged stakeholders and clear tickets.","Similarities: same activities (requirements, design, build, test, deploy), same goal of working software.","Scrum: sprints, product owner, scrum master, stand-up, review, retrospective, backlogs.","Kanban: continuous flow, board columns, work-in-progress limits.","V-model: each build stage paired with a test stage.","Your example: Useful Links changed to 1NF after code review in the same cycle, which was cheap because you work iteratively.","Waterfall still fits fixed-scope, heavily regulated work with stable requirements."],
  watch:["Assessors ask for similarities as well as differences. Have two ready."],
  cards:[
   {f:"Core difference between Agile and Waterfall?",b:"Waterfall goes through the stages once in order; Agile loops through them in small increments with feedback each time.",an:"Waterfall is cooking a full roast to a fixed recipe. Agile is cooking tapas: taste each dish, adjust the next one."},
   {f:"Two similarities between Agile and Waterfall?",b:"Both cover the same SDLC activities, and both aim to deliver tested software that meets stakeholder needs.",an:"Two routes to the same destination: same stops, different timetable."},
   {f:"When would you pick Waterfall?",b:"Stable, fixed requirements, fixed deadline, heavy regulatory documentation and sign-off.",an:"Building a bridge: you don't 'iterate' on the foundations once concrete is poured."},
   {f:"Your Agile example?",b:"Useful Links: reviewer asked for first normal form, so links moved to their own table in the same cycle.",an:"Like a satnav recalculating the route the moment you miss a turn, rather than at the end of the journey."},
   {f:"What's a retrospective for?",b:"The team reflects on how it worked and agrees improvements for next time.",an:"A football team watching the match replay to fix tactics, not to replay the goals."},
   {f:"What is Kanban?",b:"Continuous flow on a board with work-in-progress limits; no fixed sprints.",an:"A supermarket checkout: customers flow through and you only open as many tills as you can staff."}
  ]},
 comms:{ intro:"Choosing the right channel and language for engineers and non-technical people, and working well as a team.",
  key:["Technical audience: syntax, API paths, data models, error logs, trade-offs.","Non-technical audience: business impact, risk reduction, user benefit, progress, outcomes.","Channels: stand-ups, written summaries, Jira, code review, diagrams, live demos, documentation.","Synchronous (stand-up, demo) is fast but leaves no record; asynchronous (written, Jira) leaves a record but is slower.","Best practice: discuss live, then confirm in writing.","Your evidence: show-and-tell of the Security Data Hub, architecture diagram, written summaries after discussions.","Inclusion: written follow-ups for people who missed calls, plain language, pairing with the other apprentice, inviting quieter voices.","Distinction: compare and contrast the channels and say the benefits of each for each audience."],
  watch:["B4 names inclusion and diversity explicitly. Have a specific example, not a general statement."],
  cards:[
   {f:"How do you adapt for a non-technical audience?",b:"Lead with the outcome and the risk it reduces, use plain language and visuals, skip implementation detail.",an:"A doctor tells you 'this tablet lowers your blood pressure', not the chemistry of how it binds to receptors."},
   {f:"Why write a summary after a call?",b:"It creates a record, catches misunderstandings, and includes anyone who wasn't there.",an:"Like a receipt after paying: proof of what was agreed if anyone remembers differently."},
   {f:"Sync vs async communication?",b:"Sync is fast and interactive but leaves little record; async leaves a record and suits different schedules but feedback is slower.",an:"A phone call versus a letter: one is quick, the other can be filed."},
   {f:"Why use a live demo rather than slides?",b:"It shows real behaviour, the user problem and limitations, and builds buy-in.",an:"A test drive tells you more than the car brochure."},
   {f:"Why did the team need many disciplines?",b:"A rule only has value as part of a chain: event → rule → alert → investigation → response → audit trail.",an:"A relay race: the fastest runner still loses if the baton is dropped at the handover."},
   {f:"An inclusion example?",b:"Written follow-ups for colleagues who missed calls, pairing with the other apprentice, explaining without jargon in the show-and-tell.",an:"Putting subtitles on a film: more people can follow it, and it costs the others nothing."}
  ]},
 design:{ intro:"Design patterns, reusable solutions, diagrams and implementing a design securely and maintainably.",
  key:["Principles: single responsibility, DRY, separation of concerns, loose coupling.","Your reusable solutions: shared pagination pattern, SOAR playbook skeletons (template), OpenAPI-generated client, Chakra test wrapper, modular metrics components.","Off-the-shelf (GitPython, OpenAPI generator, Chakra, Vertex AI): fast and tested, but dependency, security and licensing risk.","Bespoke (pagination, skeletons): fits exactly, but you maintain it.","Recommend off-the-shelf for generic solved problems, bespoke for domain logic.","Architecture diagram: enough detail for decisions, simple enough for non-specialists. Second version removed clutter.","S17: OpenAPI ROOT_PATH bug fixed at the root cause in the backend, frontend workarounds reverted.","Naming matters: the 'preprocessing' component renamed when it did metric calculations."],
  watch:["Distinction asks you to evaluate and recommend reusable approaches, not just list them."],
  cards:[
   {f:"What is the single responsibility principle?",b:"Each function or class has one job and one reason to change.",an:"A kitchen brigade: the pastry chef doesn't also wash up and take orders."},
   {f:"Why generate the frontend client from OpenAPI?",b:"Hand-written calls drift from the backend; generation keeps types and routes in sync and turns mismatches into compile errors.",an:"Printing a map from GPS data rather than tracing it by hand: it can't drift from the real roads."},
   {f:"Off-the-shelf vs bespoke?",b:"Off-the-shelf: faster, proven, maintained by others, but less control and dependency risk. Bespoke: exact fit, but you own maintenance.",an:"Buying a suit off the rack versus having one tailored."},
   {f:"Why was the pagination pattern shared?",b:"One consistent approach across resources: frontend integrates once, less duplicate code, tested once.",an:"Every plug in the house uses the same socket, so any appliance works in any room."},
   {f:"Why were the SOAR skeletons valuable?",b:"A template: consistent structure, less repeated setup, seniors could focus on complex logic.",an:"A colouring-book outline: the shape is fixed, others fill in the detail."},
   {f:"Why revert the frontend ROOT_PATH workarounds?",b:"They patched symptoms; the real fault was missing backend config. Workarounds would break other environments.",an:"Taking painkillers for a broken leg instead of setting the bone."}
  ]},
 policy:{ intro:"GDPR, secure development, organisational procedures and acting with integrity.",
  key:["GDPR principles: lawfulness, purpose limitation, data minimisation, accuracy, storage limitation, integrity and confidentiality, accountability.","No real customer data in tests; non-production environments.","Credentials in environment variables, never in source or version history (BindPlane crawler).","Least privilege; approved internal services; audit trails through PRs.","Integrity: never claim a test passed without evidence; report blockers; don't hide failures.","Responsible AI: disparate impact flags a disparity to investigate, it does not prove discrimination.","Procedure under pressure: raise it with your lead, don't work around it.","Banks are regulated (FCA): change control, audit and operational resilience matter."],
  watch:["Give a specific example of a policy changing what you did, not just a list of policies."],
  cards:[
   {f:"What is data minimisation?",b:"Only collect and use the personal data you actually need for the purpose.",an:"Packing for a weekend: take what you need, not your whole wardrobe."},
   {f:"Why environment variables for credentials?",b:"Keeps secrets out of source code, version history and review output.",an:"Keeping your house key in your pocket, not taped to the front door."},
   {f:"What is least privilege?",b:"Give each person or service only the access needed for the task.",an:"A hotel key card that opens your room, not every room in the building."},
   {f:"What can a disparate impact score not tell you?",b:"Why a disparity exists, whether the model caused it, or whether it's unlawful. It's an indicator.",an:"A smoke alarm tells you to check the kitchen; it doesn't tell you what's burning."},
   {f:"What does integrity look like day to day?",b:"Being honest when tests haven't run, never claiming validation without evidence, preserving audit history.",an:"An MOT tester who won't sign off brakes they didn't actually check."},
   {f:"Why are audit trails important in a bank?",b:"Regulators and the business must be able to prove who changed what, when and why.",an:"A bank statement for your code: every transaction is traceable."}
  ]},
 vcs:{ intro:"Git workflow, code review and CI/CD pipelines.",
  key:["Feature branch → small commits → pull request → peer review → merge → release-candidate branch → Harness → container image.","Review catches defects, shares knowledge, enforces standards and leaves an audit trail.","CI: every change built and tested automatically. CD: tested builds promoted through environments.","Alembic migrations are versioned alongside the code.","Generated artefacts (e.g. compiled pipeline YAML) are rebuilt, not committed.","Secrets never committed; .gitignore for generated files.","GitPython automated clone-or-pull so the crawler always used current config."],
  watch:["K8 and S14 are assessed together: explain why the procedure exists, not just what it is."],
  cards:[

   {f:"What is continuous integration?",b:"Every change is automatically built and tested so problems are caught quickly.",an:"A spell-checker that runs as you type, rather than at the end of the book."},
   {f:"Why remove generated artefacts from Git?",b:"They are reproducible outputs; committing them adds noise, conflicts and stale files.",an:"You keep the recipe, not a photo of every cake you baked."},
   {f:"What did GitPython solve?",b:"The crawler processed stale local copies; now it clones if missing or pulls if present before processing.",an:"Checking you have today's newspaper, not last week's, before reading the headlines."},

  ]},
 data:{ intro:"Relational and non-relational databases, normalisation, and linking code to data.",
  key:["Relational: tables, primary and foreign keys, SQL, ACID transactions.","1NF: atomic values, no repeating groups. Useful Links moved to its own table.","Non-relational: document (MongoDB), key-value (Redis), wide-column (Cassandra), graph (Neo4j).","NoSQL trade-off: flexible schema and horizontal scaling versus weaker joins and often eventual consistency.","Your stack: SQLModel ORM, Alembic migrations, filters with WHERE, sorting with ORDER BY, LIMIT/OFFSET pagination, COUNT for totals.","Data path: database → API response → client function → state → component.","Fairness data: validate categorical inputs, group only by declared columns, selection rate = selected ÷ eligible."],
  watch:["Your evidence is relational. Be ready with a non-relational example: raw security event logs, caching, or a graph of fraud links."],
  cards:[
   {f:"Relational vs non-relational in one line each?",b:"Relational: fixed tables linked by keys, SQL, strong consistency. Non-relational: flexible documents, key-values or graphs that scale out easily.",an:"A filing cabinet with labelled folders versus a big box of sticky notes you can rearrange freely."},
   {f:"What is first normal form?",b:"Each field holds one atomic value; no lists or repeating groups in a column.",an:"One item per supermarket shelf label, not 'beans, peas and soup' on one tag."},
   {f:"What is a foreign key?",b:"A column referencing another table's primary key, linking rows and protecting integrity.",an:"A luggage tag with your booking number: it ties the bag to the right passenger."},
   {f:"How does pagination work in SQL?",b:"Filter with WHERE, order with ORDER BY, take a page with LIMIT and skip earlier pages with OFFSET; COUNT for totals.",an:"A search engine showing ten results per page, with 'page 3 of 40' at the bottom."},
   {f:"What does an ORM like SQLModel do?",b:"Maps Python classes to tables so you work with objects; it also uses parameterised queries that block SQL injection.",an:"A translator so you can speak Python while the database hears SQL."},
   {f:"When would you use a document store?",b:"High-volume, semi-structured data whose shape changes, like raw security events.",an:"A scrapbook where every page can be laid out differently."},
   {f:"Why did the .map() error happen?",b:"The paginated API returned an object with items inside, not a bare array.",an:"Expecting the sandwiches but being handed the lunchbox: open it first."}
  ]},
 testing:{ intro:"Test types, frameworks, methodologies, and how you evaluate and justify them.",
  key:["Types: unit, integration, system, UAT, regression, non-functional (performance, security, accessibility).","Pyramid: many fast unit tests, fewer integration tests, few end-to-end tests.","Methodologies: TDD (red, green, refactor), BDD (Given/When/Then), V-model, black box vs white box.","Your frontend tests: rendering, input, validation, success and failure, mocked API, Chakra provider wrapper.","Mocks: fast and deterministic, can force errors; but can't prove the real integration.","Verification: built it right. Validation: built the right thing.","Pipeline evidence: compiles → accepted → executes → outputs correct.","Defect process: reproduce → check inputs → review logic → compare to requirements → fix → retest → record."],
  watch:["Distinction: evaluate frameworks and justify the choice. Know the name of your frontend test library."],
  cards:[
   {f:"Unit vs integration test?",b:"Unit tests one piece in isolation; integration tests that pieces work together, like API plus database.",an:"Testing each Lego brick, versus checking the bricks actually click together."},
   {f:"Why mock the API in component tests?",b:"Fast, repeatable tests without a backend; you can force errors and check the payload sent.",an:"A flight simulator: practise engine failures safely without crashing a real plane."},

<script>
"use strict";
// ===== lookup =====
const TOPIC_ORDER = ["sdlc","method","comms","design","policy","vcs","data","testing","ui","analysis","behaviours","algo"];
const PIECES = {}; const PIECE_ORDER = [];
PORTFOLIOS.forEach((p, pi) => p.pieces.forEach((x, xi) => { x.pf = p.id; x.pfi = pi; x.xi = xi; PIECES[x.id] = x; PIECE_ORDER.push(x.id); }));
THEORY.forEach(t => { PIECES[t.id] = t; t.theory = true; });
const DQMAP = {}; DQ.forEach(d => DQMAP[d.id] = d);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
const today = () => new Date().toISOString().slice(0, 10);
const words = t => (t.trim().match(/\S+/g) || []).length;
const fmtMin = s => { s = Math.round(s || 0); if (s < 60) return s + "s"; const m = Math.round(s / 60); return m < 60 ? m + " min" : Math.floor(m / 60) + "h " + (m % 60) + "m"; };
const fmtDate = t => new Date(t).toLocaleDateString("en-GB", { day: "numeric", month: "short" });
const topicPieces = t => PIECE_ORDER.filter(id => PIECES[id].topics.includes(t));
const topicTime = t => (S.study["topic:" + t] || 0) + PIECE_ORDER.filter(id => PIECES[id].topics[0] === t).reduce((a, id) => a + (S.study[id] || 0), 0) + THEORY.filter(x => x.topics[0] === t).reduce((a, x) => a + (S.study[x.id] || 0), 0);
const cardsKnown = t => (TSTUDY[t]?.cards || []).filter((c, i) => S.cards[t + ":" + i]).length;

// ===== state =====
const KEY = "epa-coach-v1";
const DEF = () => ({ v: 2, updatedAt: 0, study: {}, studied: {}, cards: {}, qfr: {}, dr: {}, disc: [], active: null, qfRounds: [], days: [], act: {}, prefs: { rate: 1, autoRead: false, smode: "cards" }, focus: [] });
function merge(o) { const d = DEF(); for (const k in o) d[k] = o[k]; d.prefs = Object.assign(DEF().prefs, o.prefs || {}); if (!d.cards) d.cards = {}; if (!d.act) d.act = {}; return d; }
let S = (() => { try { const r = localStorage.getItem(KEY); if (r) return merge(JSON.parse(r)); } catch (e) {} return DEF(); })();
function act() { const d = today(); if (!S.act[d]) { S.act[d] = { s: 0, q: 0 }; const ks = Object.keys(S.act).sort(); while (ks.length > 60) delete S.act[ks.shift()]; } if (!S.days.includes(d)) { S.days.push(d); S.days = S.days.slice(-90); } return S.act[d]; }
function compact() {
  S.disc = S.disc.slice(-12);
  S.disc.forEach((s, i) => { if (i < S.disc.length - 3) s.qs.forEach(q => { delete q.answer; }); });
  S.qfRounds = S.qfRounds.slice(-30);
}
function save(remoteDelay = 4000) { S.updatedAt = Date.now(); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} queueRemote(remoteDelay); }

// remote sync (private per-user doc)
let DOC = null, writing = false, again = false, rTimer = null, SYNC = false;
function setSync(on) { SYNC = on; const el = $("#syncchip"); if (el) { el.classList.toggle("on", on); el.lastChild.textContent = on ? "Synced" : "This device"; } }
function queueRemote(delay) { if (!DOC) return; clearTimeout(rTimer); rTimer = setTimeout(pushRemote, delay); }
async function pushRemote() {
  if (!DOC) return; if (writing) { again = true; return; }
  writing = true;
  try { compact(); let json = JSON.stringify(S); if (json.length > 200000) { S.disc.forEach(s => s.qs.forEach(q => delete q.answer)); json = JSON.stringify(S); } await DOC.set({ json, updatedAt: S.updatedAt }); }
  catch (e) { if (e && (e.code === "revoked" || e.code === "invalid_argument" || e.code === "not_granted")) { DOC = null; setSync(false); } }
  writing = false; if (again) { again = false; pushRemote(); }
}
async function initRemote() {
  try {
    if (!window.claude || !claude.use) return;
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if (!db || !user) return;
    const id = await user.id(); if (!id) return;
    const ref = db.doc("data/users/" + id + "/state");
    const snap = await ref.get();
    DOC = ref; setSync(true);
    if (snap.exists) {
      const d = snap.data(); let r = null; try { r = JSON.parse(d.json); } catch (e) {}
      if (r && (r.updatedAt || 0) > (S.updatedAt || 0)) { S = merge(r); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} render(); toast("Progress synced"); }
      else if (S.updatedAt > ((r && r.updatedAt) || 0)) queueRemote(500);
    } else if (S.updatedAt) queueRemote(500);
  } catch (e) { DOC = null; }
}

// ===== AI (sample capability) =====
let SAMPLE = null, AI = "checking";
const AI_OFF = ["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"];
async function initAI() {
  try { SAMPLE = (window.claude && claude.use) ? await claude.use("sample") : null; } catch (e) { SAMPLE = null; }
  AI = SAMPLE ? "on" : "off"; if ((NAV.tab === "discuss" || NAV.tab === "quick") && NAV.view === "home") render();
}
function aiFail(e) { if (e && AI_OFF.includes(e.code)) { SAMPLE = null; AI = "off"; } }

// ===== speech out =====
const TTS = {
  ok: "speechSynthesis" in window, playing: null, label: "", queue: [], onDone: null, voice: null,
  pickVoice() { if (!this.ok) return; const v = speechSynthesis.getVoices(); this.voice = v.find(x => /en-GB/i.test(x.lang) && /Daniel|Serena|Kate|Arthur|Google UK/i.test(x.name)) || v.find(x => /en-GB/i.test(x.lang)) || v.find(x => /^en/i.test(x.lang)) || null; },
  clean(t) { return t.replace(/→/g, ", then ").replace(/÷/g, " divided by ").replace(/^[->]\s?/gm, "").replace(/\be\.g\./g, "for example").replace(/\n+/g, ". ").replace(/\.\s*\./g, "."); },
  chunks(t) { const out = []; let cur = ""; (t.match(/[^.!?]+[.!?]*\s*/g) || [t]).forEach(s => { if ((cur + s).length > 220 && cur) { out.push(cur); cur = s; } else cur += s; }); if (cur.trim()) out.push(cur); return out; },
  speak(text, id, onDone, label) {
    if (!this.ok) { toast("Read-aloud isn't supported in this browser"); return; }
    this.stop(true); if (!this.voice) this.pickVoice();
    this.playing = id; this.label = label || ""; this.onDone = onDone || null; this.queue = this.chunks(this.clean(text)); this.next();
  },
  next() {
    if (!this.queue.length) { const cb = this.onDone; this.playing = null; this.onDone = null; updatePlayer(); if (cb) cb(); return; }
    const u = new SpeechSynthesisUtterance(this.queue.shift()); u.rate = S.prefs.rate; u.lang = "en-GB"; if (this.voice) u.voice = this.voice;
    u.onend = () => { if (this.playing) this.next(); }; u.onerror = () => { if (this.playing) this.next(); };
    speechSynthesis.speak(u); updatePlayer();
  },
  stop(silent) { this.queue = []; this.playing = null; this.onDone = null; PLAYLIST = null; if (this.ok) speechSynthesis.cancel(); if (!silent) updatePlayer(); }
};
if (TTS.ok) { TTS.pickVoice(); speechSynthesis.onvoiceschanged = () => TTS.pickVoice(); }
let PLAYLIST = null; // {items:[{text,label,track}], i, key}
function playList(items, key) { PLAYLIST = { items, i: 0, key: key || "" }; playCur(); }
function playCur() {
  const pl = PLAYLIST; if (!pl) return; const it = pl.items[pl.i];
  TTS.speak(it.text, it.track, () => { if (PLAYLIST === pl && pl.i < pl.items.length - 1) { pl.i++; playCur(); } else { PLAYLIST = null; updatePlayer(); } }, it.label);
  PLAYLIST = pl; updatePlayer();
}
function pieceItem(id) { const p = PIECES[id]; return { track: id, label: p.title, text: p.title + ". In plain English. " + p.simple + ". " + p.body.map(([h, b]) => h + ". " + b).join(". ") + ". How to say it in the discussion. " + p.say }; }
function updatePlayer() {
  const el = $("#player"); const on = !!TTS.playing && TTS.playing !== "q";
  el.hidden = !on; $("#main").classList.toggle("with-player", on);
  document.querySelectorAll("[data-pk]").forEach(b => { const live = on && PLAYLIST && b.dataset.pk === PLAYLIST.key; b.classList.toggle("live", live); const l = b.querySelector(".ll"); if (l) l.textContent = live ? "Stop" : b.dataset.l; });
  if (!on) return;
  const more = PLAYLIST && PLAYLIST.i < PLAYLIST.items.length - 1;
  el.innerHTML = `<div class="wrap"><div class="t"><span class="pmeta">Now reading${PLAYLIST && PLAYLIST.items.length > 1 ? ` · ${PLAYLIST.i + 1} of ${PLAYLIST.items.length}` : ""}</span><b>${esc(TTS.label)}</b></div>
   <button data-act="rate">${S.prefs.rate}×</button>${more ? `<button data-act="pnext">Next</button>` : ""}<button data-act="pstop">Stop</button></div>`;
}

// ===== speech in =====
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let REC = null, micBlocked = !SR;
function toggleMic() {
  const ta = $("#ans"); if (!ta) return;
  if (REC) { REC.stop(); return; }
  if (micBlocked) { $("#michint").hidden = false; ta.focus(); return; }
  try {
    REC = new SR(); REC.lang = "en-GB"; REC.continuous = true; REC.interimResults = true;
    const base = ta.value ? ta.value.replace(/\s*$/, " ") : ""; let finalTxt = "";
    REC.onresult = ev => { let interim = ""; for (let i = ev.resultIndex; i < ev.results.length; i++) { const r = ev.results[i]; if (r.isFinal) finalTxt += r[0].transcript + " "; else interim += r[0].transcript; } ta.value = base + finalTxt + interim; draftSave(); };
    REC.onerror = ev => { if (["not-allowed", "service-not-allowed", "audio-capture"].includes(ev.error)) { micBlocked = true; const h = $("#michint"); if (h) h.hidden = false; } };
    REC.onend = () => { REC = null; const m = $("#micbtn"); if (m) { m.classList.remove("live"); m.setAttribute("aria-label", "Speak your answer"); } const l = $("#miclbl"); if (l) l.textContent = "Speak"; };
    REC.start(); const m = $("#micbtn"); m.classList.add("live"); m.setAttribute("aria-label", "Stop listening"); $("#miclbl").textContent = "Listening";
  } catch (e) { micBlocked = true; REC = null; $("#michint").hidden = false; }
}

// ===== scoring helpers =====
function pushScore(map, topic, v, keep) { (map[topic] = map[topic] || []).push(v); map[topic] = map[topic].slice(-keep); }
function topicStat(t) {

  if (center != null) s += `<text x="50%" y="${size / 2 + (sub ? 2 : 7)}" text-anchor="middle" class="mono" font-size="${Math.round(size / 6.5)}" font-weight="700" fill="var(--ink)">${esc(center)}</text>`;
  if (sub) s += `<text x="50%" y="${size / 2 + size / 7}" text-anchor="middle" font-size="9.5" font-weight="800" fill="var(--muted)" letter-spacing="1.5">${esc(sub)}</text>`;
  return s + `</svg>`;
}
const legend = segs => `<div class="legend">${segs.map(g => `<div><i style="background:${g.c};box-shadow:0 0 8px ${g.c}"></i><span>${esc(g.l)}</span><b class="mono">${esc(g.r)}</b></div>`).join("")}</div>`;
function renderProgress() {
  header("Dashboard", "EPA readiness", false);
  const stats = TOPIC_ORDER.map(k => ({ k, ...topicStat(k) })).filter(s => s.pct != null);
  const grade = stats.length ? Math.round(avg(stats.map(s => s.pct))) : 0;
  const gname = !stats.length ? "Start a quiz" : grade >= 80 ? "Distinction" : grade >= 50 ? "Pass" : "Below pass";
  const allQ = Object.values(S.qfr).flat();
  const right = allQ.filter(v => v === 1).length, part = allQ.filter(v => v === 0.5).length, wrong = allQ.filter(v => v === 0).length;
  const acc = allQ.length ? Math.round(avg(allQ) * 100) : 0;
  const totalT = Object.values(S.study).reduce((a, b) => a + b, 0);
  let streak = 0; { const d = new Date(); for (;;) { const k = d.toISOString().slice(0, 10); if (S.days.includes(k)) { streak++; d.setDate(d.getDate() - 1); } else if (streak === 0 && k === today()) d.setDate(d.getDate() - 1); else break; } }
  const answered = Math.max(Object.values(S.act).reduce((a, x) => a + (x.q || 0), 0), allQ.length);
  const gg = `<svg viewBox="0 0 200 200" width="196" height="196" class="donut" aria-hidden="true"><defs><linearGradient id="gr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00E5FF"/><stop offset="1" stop-color="#FF2BD6"/></linearGradient></defs>
    <circle cx="100" cy="100" r="84" fill="none" stroke="var(--sunk)" stroke-width="14"/>
    ${grade ? `<circle cx="100" cy="100" r="84" fill="none" stroke="url(#gr)" stroke-width="14" stroke-linecap="round" stroke-dasharray="${(grade / 100 * 527.8).toFixed(1)} 527.8" transform="rotate(-90 100 100)" class="glow"/>` : ""}
    ${[50, 80].map(v => { const a = (v / 100) * 2 * Math.PI - Math.PI / 2; return `<line x1="${(100 + 72 * Math.cos(a)).toFixed(1)}" y1="${(100 + 72 * Math.sin(a)).toFixed(1)}" x2="${(100 + 96 * Math.cos(a)).toFixed(1)}" y2="${(100 + 96 * Math.sin(a)).toFixed(1)}" stroke="var(--ink)" stroke-width="2" opacity=".6"/>`; }).join("")}
    <text x="100" y="106" text-anchor="middle" class="mono" font-size="46" font-weight="700" fill="var(--ink)">${grade}<tspan font-size="22" fill="var(--muted)">%</tspan></text>
    <text x="100" y="132" text-anchor="middle" font-size="11" font-weight="800" letter-spacing="2" fill="var(--accent)">${esc(gname.toUpperCase())}</text></svg>`;
  let h = `<div class="stack">
   <div class="panel hero"><div class="eyebrow">Current grade</div>${gg}
    <div class="scale"><div class="track"><i style="width:${grade}%"></i></div><span style="left:50%">PASS 50</span><span style="left:80%">DIST 80</span></div>
    <p class="small muted" style="text-align:center">Your average across quick-fire answers and mock discussion scores.</p></div>`;
  const sorted = stats.slice().sort((a, b) => b.pct - a.pct);
  let strong = [], weak = [];
  if (sorted.length >= 6) { strong = sorted.slice(0, 3); weak = sorted.slice(-3).reverse(); }
  else { const half = Math.ceil(sorted.length / 2); strong = sorted.slice(0, half); weak = sorted.slice(half).reverse(); }
  const sw = (arr, cls, empty) => arr.length ? arr.map((s, i) => `<button class="swrow" data-act="topic" data-v="${s.k}"><span class="rk mono">0${i + 1}</span><span class="nm">${esc(TOPICS[s.k].name)}</span><b class="mono" style="color:var(--${cls})">${s.pct}%</b></button>`).join("") : `<p class="small muted">${empty}</p>`;
  h += `<div class="sw"><div class="panel"><div class="eyebrow" style="color:var(--good)">▲ Strengths · ease off</div>${sw(strong, "good", "Play a quick-fire round to see your strongest topics.")}</div><div class="panel"><div class="eyebrow" style="color:var(--bad)">▼ Weaknesses · focus here</div>${sw(weak, "bad", sorted.length ? "Answer questions in more topics to compare." : "Your weakest topics will show here.")}</div></div>`;
  h += `<div class="kpis"><div class="panel kpi"><span>Quiz accuracy</span><b class="mono" style="color:#00E5FF">${acc}%</b></div><div class="panel kpi"><span>Answered</span><b class="mono" style="color:#FF2BD6">${answered}</b></div><div class="panel kpi"><span>Study time</span><b class="mono" style="color:#A6FF3D">${fmtMin(totalT)}</b></div><div class="panel kpi"><span>Day streak</span><b class="mono" style="color:#FFB224">${streak}</b></div></div>`;
  const pie = [{ l: "Correct", v: right, c: "#A6FF3D", r: right }, { l: "Partly", v: part, c: "#FFB224", r: part }, { l: "Wrong", v: wrong, c: "#FF3D71", r: wrong }];
  h += `<div class="panel"><div class="eyebrow">Quiz answers</div><div class="pierow">${donut(pie, 136, 18, acc + "%", "ACCURACY")}${legend(pie)}</div></div>`;
  if (stats.length >= 3) h += `<div class="panel"><div class="eyebrow">Topic radar</div>${radar(stats)}</div>`;
  if (stats.length) h += `<div class="panel stack" style="gap:12px"><div class="eyebrow">Score by topic · weakest first</div>${stats.slice().sort((a, b) => a.pct - b.pct).map(s => `<button class="nbar" data-act="topic" data-v="${s.k}"><span class="lbl">${esc(TOPICS[s.k].name)}</span><b class="mono" style="color:${bandColor(s.pct)}">${s.pct}%</b><span class="track"><i style="width:${Math.max(s.pct, 2)}%;background:${bandColor(s.pct)};box-shadow:0 0 10px ${bandColor(s.pct)}"></i></span><span class="sub">${s.qn ? `Quiz ${s.qp}% · ${s.qn} answers` : ""}${s.qn && s.dn ? " · " : ""}${s.dn ? `Mock ${s.dp}%` : ""}</span></button>`).join("")}</div>`;
  const ms = S.disc.slice(-10);
  if (ms.length) h += `<div class="panel"><div class="eyebrow">Mock discussion trend</div>${trendSvg(ms)}</div>`;
  h += `<div class="panel"><div class="eyebrow">Last 14 days · minutes studied</div>${activitySvg()}</div>`;
  const tt = TOPIC_ORDER.map(t => ({ t, v: topicTime(t) })).filter(x => x.v > 0).sort((a, b) => b.v - a.v);
  if (tt.length) {
    const top = tt.slice(0, 5), rest = tt.slice(5).reduce((a, x) => a + x.v, 0);
    const segs = top.map((x, i) => ({ l: TOPICS[x.t].name, v: x.v, c: NEON[i], r: fmtMin(x.v) })); if (rest) segs.push({ l: "Other", v: rest, c: "#5B6472", r: fmtMin(rest) });
    h += `<div class="panel"><div class="eyebrow">Where your study time goes</div><div class="pierow">${donut(segs, 136, 18, fmtMin(totalT), "TOTAL")}${legend(segs)}</div></div>`;
  }
  h += `<div class="stack" style="gap:8px;align-items:center;padding-top:8px"><button class="link small" style="color:var(--bad)" data-act="reset">Reset all progress</button><div id="resetc" hidden class="row small"><span>This deletes scores, sessions and study time.</span><button class="btn small" style="background:var(--bad);color:#0A0208" data-act="resetyes">Delete everything</button></div></div>`;
  return h + `</div>`;
}
function radar(stats) {
  const W = 320, c = 160, R = 100, n = stats.length;
  const pt = (i, v) => { const a = -Math.PI / 2 + i * 2 * Math.PI / n; return [c + R * v / 100 * Math.cos(a), c + R * v / 100 * Math.sin(a)]; };
  const f = p => p.map(x => x.toFixed(1)).join(",");
  let s = `<svg viewBox="0 0 ${W} ${W}" width="100%" style="max-width:340px;display:block;margin:0 auto" role="img" aria-label="Topic scores radar">`;
  [25, 50, 75, 100].forEach(v => { s += `<polygon points="${stats.map((_, i) => f(pt(i, v))).join(" ")}" fill="none" stroke="var(--line)" stroke-width="1"/>`; });
  stats.forEach((st, i) => { const [x, y] = pt(i, 100); s += `<line x1="${c}" y1="${c}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--line)"/>`; const [lx, ly] = pt(i, 128); const short = TOPICS[st.k].name.split(/[ &,]/)[0]; s += `<text x="${lx.toFixed(1)}" y="${(ly + 4).toFixed(1)}" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--muted)">${esc(short)}</text>`; });
  s += `<polygon points="${stats.map((st, i) => f(pt(i, Math.max(st.pct, 3)))).join(" ")}" fill="#00E5FF" fill-opacity=".18" stroke="#00E5FF" stroke-width="2" class="glow"/>`;
  stats.forEach((st, i) => { const [x, y] = pt(i, Math.max(st.pct, 3)); s += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.5" fill="#FF2BD6"/>`; });
  return s + `</svg>`;
}
function activitySvg() {
  const days = []; const d = new Date(); d.setDate(d.getDate() - 13);
  for (let i = 0; i < 14; i++) { const k = d.toISOString().slice(0, 10); days.push({ k, m: Math.round(((S.act[k] || {}).s || 0) / 60), lbl: d.toLocaleDateString("en-GB", { weekday: "narrow" }) }); d.setDate(d.getDate() + 1); }
  const W = 320, H = 130, L = 6, B = 22, T = 16, bw = (W - L * 2) / 14, mx = Math.max(10, ...days.map(x => x.m));
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Minutes studied per day">`;
  s += `<line x1="${L}" x2="${W - L}" y1="${H - B}" y2="${H - B}" stroke="var(--line)"/>`;
  days.forEach((x, i) => { const bh = x.m / mx * (H - B - T); const xx = L + i * bw + 3; const last = i === 13;
    s += `<rect x="${xx.toFixed(1)}" y="${(H - B - Math.max(bh, 2)).toFixed(1)}" width="${(bw - 6).toFixed(1)}" height="${Math.max(bh, 2).toFixed(1)}" rx="3" fill="${last ? "#FF2BD6" : "#00E5FF"}" opacity="${x.m ? 1 : .2}"/>`;
    if (x.m && (last || x.m === mx)) s += `<text x="${(xx + (bw - 6) / 2).toFixed(1)}" y="${(H - B - bh - 4).toFixed(1)}" text-anchor="middle" font-size="9.5" font-weight="700" fill="var(--ink)" class="mono">${x.m}</text>`;
    s += `<text x="${(xx + (bw - 6) / 2).toFixed(1)}" y="${H - 6}" text-anchor="middle" font-size="9.5" fill="var(--muted)">${x.lbl}</text>`; });
  return s + `</svg>`;
}
function trendSvg(ms) {
  const W = 340, H = 170, L = 30, R = 78, T = 14, B = 28, iw = W - L - R, ih = H - T - B;
  const x = i => L + (ms.length === 1 ? iw / 2 : i * iw / (ms.length - 1)), y = v => T + ih - v / 100 * ih;
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Mock discussion scores over time">`;
  [0, 50, 100].forEach(v => { s += `<line x1="${L}" x2="${L + iw}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" font-size="10" fill="var(--muted)">${v}</text>`; });
  [[50, "Pass", "--warn"], [80, "Distinction", "--good"]].forEach(([v, l, c]) => { s += `<line x1="${L}" x2="${L + iw}" y1="${y(v)}" y2="${y(v)}" stroke="var(${c})" stroke-dasharray="4 4" stroke-width="1.2"/><text x="${L + iw + 6}" y="${y(v) + 4}" font-size="10.5" font-weight="700" fill="var(${c})">${l}</text>`; });
  if (ms.length > 1) s += `<path d="M${ms.map((m, i) => x(i) + " " + y(m.score)).join(" L")} L${x(ms.length - 1)} ${y(0)} L${x(0)} ${y(0)}Z" fill="var(--accent)" fill-opacity=".12"/><polyline points="${ms.map((m, i) => x(i) + "," + y(m.score)).join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round" class="glow"/>`;
  ms.forEach((m, i) => { const last = i === ms.length - 1; s += `<circle cx="${x(i)}" cy="${y(m.score)}" r="${last ? 5.5 : 3.5}" fill="${last ? "#FF2BD6" : "var(--surface)"}" stroke="${last ? "#FF2BD6" : "var(--accent)"}" stroke-width="2"/>`; });
  const lm = ms[ms.length - 1]; s += `<text x="${x(ms.length - 1)}" y="${y(lm.score) - 10}" text-anchor="middle" font-size="12" font-weight="800" fill="var(--ink)" class="mono">${lm.score}%</text>`;
  s += `<text x="${L}" y="${H - 8}" font-size="10" fill="var(--muted)">${fmtDate(ms[0].date)}</text>${ms.length > 1 ? `<text x="${L + iw}" y="${H - 8}" text-anchor="end" font-size="10" fill="var(--muted)">${fmtDate(lm.date)}</text>` : ""}`;
  return s + `</svg>`;
}

// ===== events =====
document.addEventListener("click", e => {
  const tabBtn = e.target.closest("nav.tabs button"); if (tabBtn) { HIST.length = 0; return go(tabBtn.dataset.tab, "home", null, false); }
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act, id = b.dataset.id, v = b.dataset.v;
  switch (a) {
    case "back": back(); break;
    case "topic": go("study", "topic", v); break;
    case "smode": S.prefs.smode = v; save(20000); render(); break;
    case "flip": FC.flipped = !FC.flipped; render(); break;
    case "fcmark": { const ci = FC.order[FC.i]; S.cards[FC.t + ":" + ci] = v === "1" ? 1 : 0; act(); save(); FC.i++; FC.flipped = false; render(); break; }
    case "fcre": { const D = TSTUDY[FC.t]; let ord = D.cards.map((c, i) => i); if (v === "new") ord = ord.filter(i => !S.cards[FC.t + ":" + i]); FC = { t: FC.t, order: shuffle(ord), i: 0, flipped: false }; render(); break; }
    case "tlisten": { const t = b.dataset.t, key = b.dataset.pk; if (PLAYLIST && PLAYLIST.key === key) { TTS.stop(); break; } const items = topicAudio(t, v); if (items.length) playList(items, key); break; }
    case "piece": if (b.dataset.replace) go("study", "piece", id, false); else go("study", "piece", id); break;
    case "listen": { const key = "piece:" + id; if (PLAYLIST && PLAYLIST.key === key) TTS.stop(); else playList([pieceItem(id)], key); break; }
    case "pstop": TTS.stop(); break;
    case "pnext": if (PLAYLIST && PLAYLIST.i < PLAYLIST.items.length - 1) { const pl = PLAYLIST; pl.i++; TTS.stop(true); PLAYLIST = pl; playCur(); } break;
    case "rate": { const r = [0.8, 1, 1.2, 1.5]; S.prefs.rate = r[(r.indexOf(S.prefs.rate) + 1) % r.length]; save(20000); updatePlayer(); toast("Speed " + S.prefs.rate + "× from the next sentence"); break; }
    case "studied": S.studied[id] = !S.studied[id]; act(); save(); render(); break;
    case "practise": startSession(DQ.filter(d => d.piece === id).map(d => d.id).slice(0, 4)); break;
    case "practiseTopic": startSession(shuffle(DQ.filter(d => d.topic === v)).slice(0, 4).map(d => d.id)); break;
    case "pref": S.prefs[b.dataset.k] = Number(v); save(20000); render(); break;
    case "focus": S.prefs.focus = v; save(20000); render(); break;
    case "start": startSession(); break;
    case "resume": S.active.status = "active"; spokenFor = null; go("discuss", "session"); break;
    case "discard": $("#discardc").hidden = false; break;
    case "discardyes": S.active = null; save(); render(); break;
    case "pause": { if (REC) REC.stop(); TTS.stop(true); const ta = $("#ans"); if (ta) S.active.draft = ta.value; S.active.pausedAt = Date.now(); save(1000); toast("Paused. Resume any time from Discuss."); HIST.length = 0; go("discuss", "home", null, false); break; }
    case "autoread": { S.prefs.autoRead = !S.prefs.autoRead; const ta = $("#ans"); if (ta && S.active) S.active.draft = ta.value; save(20000); if (!S.prefs.autoRead) TTS.stop(true); else spokenFor = null; render(); break; }
    case "hear": { const it = cur(); const lastA = [...it.turns].reverse().find(t => t.r === "a"); TTS.speak(lastA.t, "q"); break; }
    case "mic": toggleMic(); break;
    case "submit": { const val = ($("#ans")?.value || "").trim(); if (words(val) < 3) { toast("Type or speak an answer first"); return; } submitAnswer(val); break; }
    case "skip": submitAnswer("", true); break;
    case "finish": { const ta2 = $("#ans"); if (ta2 && ta2.value.trim()) { toast("Send or clear your current answer first"); return; } grade(); break; }
    case "result": go("discuss", "results", id); break;
    case "again": HIST.length = 0; go("discuss", "home", null, false); break;
    case "qpref": S.prefs[b.dataset.k] = Number(v); save(20000); render(); break;
    case "qtopic": S.prefs.qtopic = v; save(20000); render(); break;
    case "qstart": qStart(); break;
    case "qhome": QS = null; go("quick", "home", null, false); break;
    case "qquit": if (QS.res.length) qFinish(); else { QS = null; go("quick", "home", null, false); } break;
    case "qpick": { const q = QS.items[QS.i]; QS.picked = Number(b.dataset.i); qRecord(QS.picked === q.a ? 1 : 0); break; }
    case "qcheck": qCheck(); break;
    case "qself": QS.marked.self = Number(v); qRecord(QS.marked.self); break;
    case "qnext": qNext(); break;
    case "reset": $("#resetc").hidden = false; break;
    case "resetyes": { const prefs = S.prefs; S = DEF(); S.prefs = prefs; save(500); toast("Progress reset"); render(); break; }
  }
});
document.addEventListener("input", e => { if (e.target.id === "ans") draftSave(); if (e.target.id === "qans" && QS) QS.draft = e.target.value; });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") { const ta = $("#ans"); if (ta && S.active) S.active.draft = ta.value; save(500); } });

if (S.active && S.active.status === "grading") S.active.status = "active";
render();
setTimeout(initRemote, 0);
initAI();

if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));

</script>
